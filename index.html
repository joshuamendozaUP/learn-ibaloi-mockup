  box-shadow: var(--shadow-sm);
}

.form-check:not(.form-switch)
  .form-check-input:not(:disabled):not(:checked):hover {
  background-color: var(--card);
}

.form-check:not(.form-switch) .form-check-input[type=&quot;checkbox&quot;]:checked {
  border-color: var(--primary);
  background-color: var(--primary);
}

.form-check:not(.form-switch)
  .form-check-input[type=&quot;checkbox&quot;]:checked::before {
  display: block;
  width: 100%;
  height: 100%;
  background: var(--primary-foreground);
  content: &quot;&quot;;
  mask: var(--checkmark-image) center / 12px 12px no-repeat;
}

.form-check-input[type=&quot;radio&quot;] {
  width: 14px;
  height: 14px;
  border-radius: var(--radius-full);
}

.form-check-input[type=&quot;radio&quot;]:checked {
  border: 2px solid var(--primary);
  background:
    radial-gradient(circle, var(--primary-foreground) 0 2.5px, transparent 3px),
    var(--primary);
}

.form-check:not(.form-switch) .form-check-input:focus-visible {
  outline: 2px solid var(--ring);
  outline-offset: 2px;
}

.form-check:not(.form-switch) .form-check-input:disabled {
  cursor: not-allowed;
  pointer-events: none;
}

.form-check:not(.form-switch) .form-check-input:disabled + .form-check-label {
  cursor: not-allowed;
}

.form-switch .form-check-input:disabled,
.form-switch .form-check-input:disabled + .form-check-label {
  cursor: not-allowed;
  opacity: 0.6;
}

.form-check-label {
  color: var(--foreground);
  cursor: var(--cursor-interaction, default);
}

.form-switch .form-check-input {
  position: relative;
  width: 32px;
  height: 20px;
  border: 0;
  border-radius: var(--radius-full);
  background: var(--muted);
  box-shadow: none;
  transition: background-color 200ms cubic-bezier(0, 0, 0.2, 1);
}

.form-switch .form-check-input::before {
  position: absolute;
  top: 50%;
  left: 0;
  width: 16px;
  height: 16px;
  box-sizing: border-box;
  border: 1px solid light-dark(var(--primary-foreground), var(--foreground));
  border-radius: var(--radius-full);
  background: light-dark(var(--primary-foreground), var(--foreground));
  box-shadow: var(--shadow-sm);
  content: &quot;&quot;;
  transform: translate(2px, -50%);
  transition: transform 200ms cubic-bezier(0, 0, 0.2, 1);
}

.form-switch .form-check-input:checked {
  background: var(--primary);
}

.form-switch .form-check-input:checked::before {
  transform: translate(14px, -50%);
}

.form-switch .form-check-input:focus-visible {
  box-shadow: 0 0 0 2px var(--ring);
}

.form-range {
  appearance: none;
  display: block;
  width: 100%;
  height: 28px;
  flex: 1;
  margin: 0;
  padding: 0;
  outline: none;
  border: 0;
  accent-color: var(--primary);
  background: linear-gradient(
      color-mix(in srgb, var(--foreground) 7%, transparent),
      color-mix(in srgb, var(--foreground) 7%, transparent)
    )
    center / 100% 2px no-repeat;
}

.form-range::-webkit-slider-runnable-track {
  height: 28px;
  background: transparent;
}

.form-range::-webkit-slider-thumb {
  appearance: none;
  width: 20px;
  height: 20px;
  margin-top: 4px;
  border: 1px solid var(--border);
  border-radius: var(--radius-full);
  background: light-dark(var(--primary-foreground), var(--foreground));
}

.form-range:focus-visible::-webkit-slider-thumb {
  border-color: var(--ring);
  box-shadow: inset 0 0 0 1px var(--ring);
}

.form-range::-moz-range-track {
  height: 28px;
  background: transparent;
}

.form-range::-moz-range-thumb {
  width: 20px;
  height: 20px;
  border: 1px solid var(--border);
  border-radius: var(--radius-full);
  background: light-dark(var(--primary-foreground), var(--foreground));
}

.form-range:focus-visible::-moz-range-thumb {
  border-color: var(--ring);
  box-shadow: inset 0 0 0 1px var(--ring);
}

.form-range:disabled {
  cursor: not-allowed;
  opacity: 0.4;
}

.btn:not(.btn-primary, .viz-tile):is(
  [aria-pressed=&quot;true&quot;],
  [aria-selected=&quot;true&quot;],
  .is-selected
) {
  border-color: var(--primary);
  color: var(--primary-foreground);
  background: var(--primary);
}

.btn.viz-tile:is([aria-pressed=&quot;true&quot;], [aria-selected=&quot;true&quot;], .is-selected) {
  border-color: var(--primary);
  box-shadow: inset 0 0 0 1px var(--primary);
}

.btn:focus-visible {
  outline: 2px solid var(--ring);
  outline-offset: 2px;
}

@media (pointer: coarse) {
  .btn,
  .form-control,
  .form-select {
    min-width: 44px;
    min-height: 44px;
  }

  .form-control,
  .form-select {
    font-size: max(16px, var(--font-size-normal));
  }

  .form-control[type=&quot;file&quot;]::file-selector-button {
    min-width: 44px;
    min-height: 44px;
  }

  .form-control-color[type=&quot;color&quot;] {
    width: 44px;
    height: 44px;
  }

  .form-control:is(
    [type=&quot;date&quot;],
    [type=&quot;datetime-local&quot;],
    [type=&quot;month&quot;],
    [type=&quot;time&quot;],
    [type=&quot;week&quot;]
  ) {
    min-width: 0;
    max-width: 100%;
    padding-block: 8px;
  }

  .form-check {
    min-height: 44px;
    padding-inline: 15px;
  }

  .form-check-input {
    position: relative;
  }

  .form-check-input::after {
    position: absolute;
    top: 50%;
    left: 50%;
    width: 44px;
    height: 44px;
    content: &quot;&quot;;
    transform: translate(-50%, -50%);
  }

  .form-check-label {
    display: inline-flex;
    min-width: 44px;
    min-height: 44px;
    align-items: center;
  }

  .form-range {
    height: 44px;
    touch-action: pan-y;
  }

  .form-range::-webkit-slider-runnable-track {
    height: 44px;
  }

  .form-range::-moz-range-track {
    height: 44px;
  }

  .form-range::-webkit-slider-thumb {
    margin-top: 12px;
  }
}

svg {
  display: block;
  max-width: 100%;
  height: auto;
}

#widget &gt; svg {
  width: 100%;
}

/* Model-authored chart rules can otherwise stretch icons after these styles load. */
svg.lucide {
  display: block;
  width: 16px !important;
  height: 16px !important;
  flex: none;
  margin: 0 !important;
  stroke-width: 1.6;
}

.text-warning,
.text-destructive {
  color: var(--destructive);
}

      max-width:1180px;
      margin:0 auto;
      padding:20px;
      background:var(--ibm-soft);
      color:var(--ibm-ink);
      font-family:Arial, &quot;Helvetica Neue&quot;, sans-serif;
      box-sizing:border-box;
    }
    #ibaloiLearnerBrandedMockup * { box-sizing:border-box; }
    #ibaloiLearnerBrandedMockup button, #ibaloiLearnerBrandedMockup input, #ibaloiLearnerBrandedMockup textarea { font:inherit; }
    .ibm-topline { height:6px; margin:-20px -20px 18px; background:linear-gradient(90deg,var(--ibm-ink) 0 60%,var(--ibm-red) 60% 70%,var(--ibm-pine) 70% 74%,var(--ibm-ochre) 74% 76%,var(--ibm-cream) 76%); }
    .ibm-head { display:flex; justify-content:space-between; align-items:flex-start; gap:18px; padding:0 5px 16px; border-bottom:1px solid var(--ibm-mist); }
    .ibm-kicker { margin:0 0 5px; color:var(--ibm-red); font-size:10px; font-weight:700; letter-spacing:.14em; text-transform:uppercase; }
    .ibm-head h1 { margin:0; max-width:680px; font-size:clamp(23px,3.1vw,36px); line-height:1.05; letter-spacing:-.045em; }
    .ibm-head p { max-width:700px; margin:8px 0 0; color:var(--ibm-gray); font-size:12px; line-height:1.45; }
    .ibm-version { flex:0 0 auto; border:1px solid var(--ibm-red); padding:8px 10px; color:var(--ibm-red); font-size:9px; font-weight:700; letter-spacing:.08em; text-transform:uppercase; }
    .ibm-flowtabs { display:flex; flex-wrap:wrap; gap:5px; padding:12px 0 15px; }
    .ibm-flowtabs button { border:1px solid var(--ibm-mist); border-radius:9px; padding:7px 9px; background:var(--ibm-paper); color:var(--ibm-gray); cursor:pointer; font-size:10px; font-weight:700; transition:background .2s ease,border-color .2s ease,transform .2s ease; }
    .ibm-flowtabs button:hover, .ibm-flowtabs button:focus-visible { border-color:var(--ibm-red); transform:translateY(-1px); }
    .ibm-flowtabs button[aria-selected=&quot;true&quot;] { border-color:var(--ibm-red); background:var(--ibm-red); color:var(--ibm-paper); }
    .ibm-layout { display:block; }
    .ibm-devicewrap { min-width:0; display:flex; justify-content:center; }
    .ibm-device { position:relative; width:min(380px,100%); min-height:675px; overflow:hidden; border:8px solid var(--ibm-ink); border-radius:34px; background:var(--ibm-paper); box-shadow:0 18px 40px rgba(24,23,22,.14); }
    .ibm-device:before { content:&quot;&quot;; position:absolute; top:6px; left:50%; width:84px; height:5px; transform:translateX(-50%); border-radius:99px; background:var(--ibm-ink); z-index:2; }
    .ibm-status { display:flex; justify-content:space-between; height:28px; padding:11px 16px 0; color:var(--ibm-gray); font-size:9px; font-weight:700; }
    .ibm-screen { min-height:625px; padding:12px 17px 60px; }
    .ibm-screen[hidden] { display:none; }
    .ibm-langbar { display:flex; align-items:center; justify-content:flex-end; gap:4px; padding:4px 17px 0; color:var(--ibm-gray); font-size:8px; }
    .ibm-langbar button { border:1px solid var(--ibm-mist); border-radius:99px; padding:5px 8px; background:var(--ibm-paper); color:var(--ibm-gray); cursor:pointer; font-size:8px; font-weight:700; }
    .ibm-langbar button[aria-pressed=&quot;true&quot;] { border-color:var(--ibm-red); background:var(--ibm-red); color:var(--ibm-paper); }
    .ibm-langnote { margin:8px 0 0; padding:7px 9px; border-radius:10px; background:var(--ibm-red-soft); color:var(--ibm-red); font-size:8px; line-height:1.35; }
    .ibm-langnote.ainu { background:var(--ibm-ochre-soft); color:var(--ibm-ink); }
    .ibm-appbar { display:flex; justify-content:space-between; align-items:center; gap:9px; margin:7px 0 15px; }
    .ibm-brand { display:flex; align-items:center; gap:7px; font-size:13px; font-weight:700; letter-spacing:-.02em; }
    .ibm-mark { width:24px; height:24px; display:grid; place-items:center; border-radius:10px; background:var(--ibm-red); color:var(--ibm-paper); font-size:13px; }
    .ibm-avatar { width:27px; height:27px; display:grid; place-items:center; border:1px solid var(--ibm-mist); border-radius:50%; color:var(--ibm-pine); font-size:11px; font-weight:700; }
    .ibm-greeting { margin:-4px 0 11px; padding:10px 12px; border:1px solid var(--ibm-mist); border-radius:12px; background:var(--ibm-ochre-soft); }
    .ibm-greeting strong { display:block; color:var(--ibm-pine); font-size:14px; letter-spacing:-.025em; }
    .ibm-greeting span { display:block; margin-top:3px; color:var(--ibm-gray); font-size:9px; }
    .ibm-eyebrow { margin:0 0 7px; color:var(--ibm-red); font-size:9px; font-weight:700; letter-spacing:.12em; text-transform:uppercase; }
    .ibm-hero { position:relative; overflow:hidden; padding:18px; border-radius:18px; background:var(--ibm-ink); color:var(--ibm-paper); }
    .ibm-hero:after { content:&quot;&quot;; position:absolute; right:-42px; bottom:-55px; width:150px; height:150px; border:1px solid rgba(244,239,230,.22); border-radius:50%; }
    .ibm-hero h2 { margin:0; max-width:260px; font-size:26px; line-height:1.03; letter-spacing:-.045em; }
    .ibm-hero p { margin:9px 0 0; color:rgba(250,247,241,.78); font-size:11px; line-height:1.45; }
    .ibm-tag { display:inline-flex; align-items:center; gap:5px; padding:5px 8px; border-radius:99px; background:var(--ibm-red); color:var(--ibm-paper); font-size:9px; font-weight:700; }
    .ibm-tag.pine { background:var(--ibm-pine); }
    .ibm-tag.ochre { background:var(--ibm-ochre); color:var(--ibm-ink); }
    .ibm-tag.mist { background:var(--ibm-mist); color:var(--ibm-ink); }
    .ibm-section { margin-top:15px; }
    .ibm-sectionhead { display:flex; justify-content:space-between; align-items:baseline; gap:10px; margin-bottom:8px; }
    .ibm-sectionhead h3 { margin:0; font-size:13px; letter-spacing:-.02em; }
    .ibm-sectionhead span { color:var(--ibm-gray); font-size:9px; }
    .ibm-note { padding:11px 12px; border-left:3px solid var(--ibm-ochre); border-radius:12px; background:var(--ibm-mist); color:var(--ibm-ink); font-size:10px; line-height:1.42; }
    .ibm-note strong { color:var(--ibm-red); }
    .ibm-action { width:100%; border:0; border-radius:11px; padding:10px 12px; background:var(--ibm-red); color:var(--ibm-paper); cursor:pointer; font-size:10px; font-weight:700; transition:transform .2s ease,box-shadow .2s ease; }
    .ibm-action:hover, .ibm-action:focus-visible { transform:translateY(-1px); box-shadow:0 5px 12px rgba(179,38,45,.18); }
    .ibm-action.secondary { border:1px solid var(--ibm-mist); background:var(--ibm-paper); color:var(--ibm-ink); }
    .ibm-action.small { width:auto; padding:8px 10px; }
    .ibm-actionrow { display:flex; gap:7px; margin-top:10px; }
    .ibm-actionrow .ibm-action { flex:1; }
    .ibm-choices { display:grid; grid-template-columns:repeat(3,1fr); gap:6px; }
    .ibm-choice { border:1px solid var(--ibm-mist); border-radius:11px; padding:10px 7px; background:var(--ibm-paper); color:var(--ibm-ink); cursor:pointer; font-size:9px; font-weight:700; text-align:center; }
    .ibm-choice.is-selected { border-color:var(--ibm-red); box-shadow:inset 0 -3px 0 var(--ibm-red); }
    .ibm-path { display:grid; grid-template-columns:repeat(4,1fr); gap:5px; }
    .ibm-pathitem { padding:8px 4px 7px; border-top:4px solid var(--ibm-ink); border-radius:9px; background:var(--ibm-paper); text-align:center; }
    .ibm-pathitem:nth-child(2) { border-color:var(--ibm-red); }
    .ibm-pathitem:nth-child(3) { border-color:var(--ibm-pine); }
    .ibm-pathitem:nth-child(4) { border-color:var(--ibm-ochre); }
    .ibm-pathitem b { display:block; font-size:8px; }
    .ibm-pathitem small { display:block; margin-top:4px; color:var(--ibm-gray); font-size:8px; }
    .ibm-routegrid { display:grid; grid-template-columns:1fr 1fr; gap:7px; }
    .ibm-route { min-height:78px; border:1px solid var(--ibm-mist); border-radius:13px; padding:10px; background:var(--ibm-paper); text-align:left; cursor:pointer; transition:transform .2s ease,box-shadow .2s ease,border-color .2s ease; }
    .ibm-route strong { display:block; font-size:10px; }
    .ibm-route span { display:block; margin-top:4px; color:var(--ibm-gray); font-size:9px; line-height:1.3; }
    .ibm-route:hover, .ibm-route:focus-visible { border-color:var(--ibm-red); transform:translateY(-1px); box-shadow:0 6px 14px rgba(24,23,22,.08); }
    .ibm-routeicon { width:28px; height:28px; display:grid; place-items:center; margin-bottom:6px; border-radius:9px; background:var(--ibm-cream); }
    .ibm-wordfocus { padding:14px; border:1px solid var(--ibm-mist); border-radius:15px; background:var(--ibm-paper); box-shadow:0 5px 14px rgba(24,23,22,.05); }
    .ibm-word { margin:3px 0 1px; color:var(--ibm-red); font-size:27px; font-weight:700; letter-spacing:-.05em; }
    .ibm-gloss { font-size:12px; }
    .ibm-meta { display:flex; flex-wrap:wrap; gap:5px; margin-top:9px; }
    .ibm-meta span { border:1px solid var(--ibm-mist); border-radius:99px; padding:4px 6px; color:var(--ibm-gray); font-size:8px; }
    .ibm-wordlist { display:grid; grid-template-columns:repeat(3,1fr); gap:6px; }
    .ibm-worditem { border:1px solid var(--ibm-mist); border-radius:11px; padding:9px 7px; background:var(--ibm-paper); color:var(--ibm-ink); cursor:pointer; text-align:left; }
    .ibm-worditem strong { display:block; color:var(--ibm-red); font-size:12px; }
    .ibm-worditem span { display:block; margin-top:3px; color:var(--ibm-gray); font-size:8px; line-height:1.25; }
    .ibm-practice { padding:13px; border:1px solid var(--ibm-mist); border-radius:15px; background:var(--ibm-paper); box-shadow:0 5px 14px rgba(24,23,22,.05); }
    .ibm-practice h3 { margin:0; font-size:19px; letter-spacing:-.035em; }
    .ibm-practice p { margin:5px 0 0; color:var(--ibm-gray); font-size:10px; line-height:1.35; }
    .ibm-steps { display:grid; gap:7px; margin-top:12px; }
    .ibm-practicestep { display:flex; align-items:center; gap:8px; padding:9px; border:1px solid var(--ibm-mist); border-radius:10px; }
    .ibm-stepnum { width:24px; height:24px; flex:0 0 24px; display:grid; place-items:center; margin:0; border-radius:50%; background:var(--ibm-ink); color:var(--ibm-paper); font-size:10px; line-height:1; font-weight:700; }
    .ibm-practicestep strong { display:block; font-size:9px; }
    .ibm-practicestep &gt; div &gt; span { display:block; margin-top:2px; color:var(--ibm-gray); font-size:8px; }
    .ibm-answer { padding:12px; border:1px solid var(--ibm-pine); border-radius:14px; background:var(--ibm-pine-soft); }
    .ibm-answer h3 { margin:0; color:var(--ibm-pine); font-size:13px; }
    .ibm-answer p { margin:6px 0 0; font-size:10px; line-height:1.4; }
    .ibm-source { display:grid; gap:5px; margin-top:9px; padding-top:8px; border-top:1px solid color-mix(in srgb,var(--ibm-pine) 30%,transparent); color:var(--ibm-pine); font-size:8px; }
    .ibm-field { width:100%; min-height:60px; border:1px solid var(--ibm-mist); border-radius:12px; padding:10px; background:var(--ibm-paper); color:var(--ibm-gray); font-size:10px; line-height:1.4; }
    .ibm-story { overflow:hidden; border:1px solid var(--ibm-ink); border-radius:17px; background:var(--ibm-ink); color:var(--ibm-paper); }
    .ibm-storyvisual { height:135px; background:linear-gradient(150deg,var(--ibm-pine) 0 48%,var(--ibm-ink) 48% 67%,var(--ibm-red) 67% 70%,var(--ibm-cream) 70% 73%,var(--ibm-ink) 73%); }
    .ibm-storycopy { padding:13px; }
    .ibm-storycopy h3 { margin:0; font-size:18px; }
    .ibm-storycopy p { margin:5px 0 10px; color:rgba(250,247,241,.75); font-size:10px; line-height:1.4; }
    .ibm-storymeta { display:flex; flex-wrap:wrap; gap:5px; }
    .ibm-storymeta span { border:1px solid rgba(250,247,241,.35); border-radius:99px; padding:4px 6px; font-size:8px; }
    .ibm-permission { margin-top:9px; color:#f0d28e; font-size:8px; }
    .ibm-bottomnav { position:absolute; right:0; bottom:0; left:0; display:grid; grid-template-columns:repeat(4,1fr); padding:9px 6px 10px; border-top:1px solid var(--ibm-mist); background:var(--ibm-paper); }
    .ibm-bottomnav button { border:0; background:transparent; color:var(--ibm-gray); cursor:pointer; font-size:0; }
    .ibm-bottomnav button.is-active { color:var(--ibm-red); font-weight:700; }
    .ibm-bottomnav button:focus-visible { outline:2px solid var(--ibm-red); outline-offset:2px; border-radius:8px; }
    .ibm-bottomnav em { display:grid; place-items:center; height:25px; margin:0; color:currentColor; font-size:15px; font-style:normal; }
    .ibm-icon { display:inline-block; width:20px; height:20px; background-image:var(--ibm-icon-sheet); background-repeat:no-repeat; background-size:400% 200%; }
    .ibm-icon-home { background-position:0 0; }
    .ibm-icon-word { background-position:33.333% 0; }
    .ibm-icon-ask { background-position:66.666% 0; }
    .ibm-icon-listen { background-position:100% 0; }
    .ibm-icon-story { background-position:0 100%; }
    .ibm-icon-mentor { background-position:33.333% 100%; }
    .ibm-icon-reflect { background-position:66.666% 100%; }
    .ibm-icon-community { background-position:100% 100%; }
    .ibm-routeicon .ibm-icon { width:25px; height:25px; }
    .ibm-bottomnav .ibm-icon { width:19px; height:19px; }
    .ibm-guides { display:grid; grid-template-columns:1fr; gap:8px; }
    .ibm-guide { display:grid; grid-template-columns:auto minmax(0,1fr); align-items:center; gap:11px; min-height:100px; overflow:hidden; padding:7px 10px; border:1px solid var(--ibm-mist); border-radius:13px; background:var(--ibm-paper); }
    .ibm-guide:first-child { display:none; }
    .ibm-guide img { width:64px; height:96px; object-fit:contain; flex:0 0 auto; border-radius:8px; }
    .ibm-guide figcaption { min-width:0; color:var(--ibm-gray); font-size:10px; line-height:1.35; }
    .ibm-guide figcaption strong { display:block; margin-bottom:4px; color:var(--ibm-ink); font-size:11px; line-height:1.2; }
    .ibm-guidenote { margin:7px 1px 0; color:var(--ibm-gray); font-size:8px; line-height:1.35; }
    .ibm-side { display:none; }
    .ibm-sidehead { display:flex; justify-content:space-between; align-items:baseline; gap:10px; margin:0 0 9px; }
    .ibm-sidehead h2 { margin:0; font-size:15px; letter-spacing:-.03em; }
    .ibm-sidehead span { color:var(--ibm-gray); font-size:9px; }
    .ibm-sidebox { padding:14px; border:1px solid var(--ibm-mist); border-radius:15px; background:var(--ibm-paper); box-shadow:0 5px 14px rgba(24,23,22,.04); }
    .ibm-sidebox + .ibm-sidebox { margin-top:10px; }
    .ibm-sidebox h3 { margin:0; font-size:13px; }
    .ibm-sidebox p { margin:5px 0 0; color:var(--ibm-gray); font-size:10px; line-height:1.4; }
    .ibm-sidegrid { display:grid; grid-template-columns:1fr 1fr; gap:8px; margin-top:12px; }
    .ibm-sideitem { padding:9px; border-left:3px solid var(--ibm-red); border-radius:0 9px 9px 0; background:var(--ibm-cream); }
    .ibm-sideitem:nth-child(2) { border-color:var(--ibm-pine); }
    .ibm-sideitem:nth-child(3) { border-color:var(--ibm-ochre); }
    .ibm-sideitem:nth-child(4) { border-color:var(--ibm-ink); }
    .ibm-sideitem b { display:block; font-size:9px; }
    .ibm-sideitem span { display:block; margin-top:4px; color:var(--ibm-gray); font-size:8px; line-height:1.3; }
    .ibm-voice { padding:12px; border-left:3px solid var(--ibm-pine); border-radius:0 12px 12px 0; background:var(--ibm-pine-soft); }
    .ibm-voice b { color:var(--ibm-pine); font-size:10px; }
    .ibm-voice p { margin:5px 0 0; color:var(--ibm-ink); font-size:10px; line-height:1.42; }
    .ibm-foot { margin:15px 5px 0; color:var(--ibm-gray); font-size:10px; line-height:1.4; }
    .ibm-foot strong { color:var(--ibm-ink); }
    @media (max-width:860px) {
      #ibaloiLearnerBrandedMockup { padding:14px; }
      .ibm-topline { margin:-14px -14px 16px; }
      .ibm-head { flex-direction:column; }
      .ibm-layout { grid-template-columns:1fr; }
      .ibm-side { order:2; }
    }
    @media (max-width:430px) {
      .ibm-layout { display:block; }
      .ibm-devicewrap { margin-bottom:15px; }
      .ibm-path { grid-template-columns:repeat(2,1fr); }
    }

    if (event.target.closest(&#x27;#ibmSaveWord&#x27;)) event.target.closest(&#x27;#ibmSaveWord&#x27;).textContent = &#x27;Saved&#x27;;
    if (event.target.closest(&#x27;#ibmTryAgain&#x27;)) event.target.closest(&#x27;#ibmTryAgain&#x27;).textContent = &#x27;Ready to respond&#x27;;
    if (event.target.closest(&#x27;#ibmTraceSource&#x27;)) event.target.closest(&#x27;#ibmTraceSource&#x27;).textContent = &#x27;Source shown&#x27;;
    if (event.target.closest(&#x27;#ibmStartStory&#x27;)) event.target.closest(&#x27;#ibmStartStory&#x27;).textContent = &#x27;Story playing · pause&#x27;;
  });
  show(&#x27;welcome&#x27;);
})();

&lt;script src=&quot;https://unpkg.com/@floating-ui/core@1.7.3/dist/floating-ui.core.umd.min.js&quot;&gt;&lt;/script&gt;

    return;

  const tooltipPlacements = new Set([&quot;top&quot;, &quot;right&quot;, &quot;bottom&quot;, &quot;left&quot;]);
  const tooltipId = `codex-visualization-tooltip-${
    window.crypto?.randomUUID?.() ?? Date.now().toString(36)
  }`;
  const tooltipGap = 5;
  const hoverDelay = 700;
  const skipDelay = 300;
  let activeTrigger = null;
  let pendingTrigger = null;
  let tooltip = null;
  let openTimeout = null;
  let autoUpdateCleanup = null;
  let positionRequest = 0;
  let skipDelayUntil = 0;
  let lastPointerWasTouch = false;
  let pinnedByTouch = false;

  const getTrigger = (target) =&gt;
    target?.nodeType === Node.ELEMENT_NODE
      ? target.closest(&quot;[data-tooltip]&quot;)
      : null;
  const containsTarget = (trigger, target) =&gt;
    target?.nodeType != null &amp;&amp; trigger.contains(target);
  const getContent = (trigger) =&gt;
    trigger.getAttribute(&quot;data-tooltip&quot;)?.trim() ?? &quot;&quot;;
  const getPlacement = (trigger) =&gt; {
    const placement = trigger.getAttribute(&quot;data-tooltip-placement&quot;);
    return tooltipPlacements.has(placement) ? placement : &quot;top&quot;;
  };
  const getTooltip = () =&gt; {
    if (tooltip == null) {
      tooltip = document.createElement(&quot;div&quot;);
      tooltip.id = tooltipId;
      tooltip.className = &quot;tooltip&quot;;
      tooltip.setAttribute(&quot;role&quot;, &quot;tooltip&quot;);
    }

  };
  const setDescribedBy = (trigger, described) =&gt; {
    const ids = new Set(
      (trigger.getAttribute(&quot;aria-describedby&quot;) ?? &quot;&quot;)
        .split(/\s+/)
        .filter(Boolean),
    );

      ids.add(tooltipId);
    } else {

    }

      trigger.removeAttribute(&quot;aria-describedby&quot;);
    } else {
      trigger.setAttribute(&quot;aria-describedby&quot;, [...ids].join(&quot; &quot;));

    if (openTimeout != null) {
      window.clearTimeout(openTimeout);
      openTimeout = null;
    }
    pendingTrigger = null;
  };
  const closeTooltip = (activateSkipDelay = true) =&gt; {
    clearOpenTimeout();
    pinnedByTouch = false;
    positionRequest += 1;
    autoUpdateCleanup?.();
    autoUpdateCleanup = null;
    if (activeTrigger == null) {
      return;

    activeTrigger = null;
    tooltip?.remove();

    const request = ++positionRequest;

      middleware: [
        offset(tooltipGap),
        flip({ padding: tooltipGap }),
        shift({ padding: tooltipGap }),

          padding: tooltipGap,
          apply({ availableHeight, availableWidth, elements }) {

              `${Math.max(0, availableWidth)}px`,
            );
            elements.floating.style.setProperty(
              &quot;--tooltip-available-height&quot;,
              `${Math.max(0, availableHeight)}px`,
            );

      return;
    }

      return;
    }

    floating.textContent = content;
    floating.style.visibility = &quot;hidden&quot;;
    floating.style.transform = &quot;translate(0, 0)&quot;;

    activeTrigger = trigger;
    setDescribedBy(trigger, true);
    autoUpdateCleanup = autoUpdate(trigger, floating, () =&gt; {

    });
  };
  const requestOpen = (trigger, immediate = false) =&gt; {
    if (
      getContent(trigger).length === 0 ||
      activeTrigger === trigger ||
      pendingTrigger === trigger
    ) {
      return;
    }
    clearOpenTimeout();
    pendingTrigger = trigger;
    const delay =
      immediate || activeTrigger != null || Date.now() &lt; skipDelayUntil
        ? 0
        : hoverDelay;
    if (delay === 0) {
      openTooltip(trigger);
      return;
    }
    openTimeout = window.setTimeout(() =&gt; {

      pendingTrigger = null;

    document.removeEventListener(&quot;pointerout&quot;, handleLeave);
    document.removeEventListener(&quot;focusin&quot;, handleFocusIn);
    document.removeEventListener(&quot;focusout&quot;, handleLeave);
    document.removeEventListener(&quot;keydown&quot;, handleKeyDown);
    document.removeEventListener(&quot;contextmenu&quot;, handleContextMenu);
    tooltip = null;
  };

  document.addEventListener(&quot;pointerover&quot;, handlePointerOpen);
  document.addEventListener(&quot;pointerdown&quot;, handlePointer);
  document.addEventListener(&quot;pointercancel&quot;, handlePointer);
  document.addEventListener(&quot;click&quot;, handleTouchClick);
  document.addEventListener(&quot;pointerout&quot;, handleLeave);
  document.addEventListener(&quot;focusin&quot;, handleFocusIn);
  document.addEventListener(&quot;focusout&quot;, handleLeave);
  document.addEventListener(&quot;keydown&quot;, handleKeyDown);
  document.addEventListener(&quot;contextmenu&quot;, handleContextMenu);
  window.addEventListener(&quot;pagehide&quot;, destroy, { once: true });
})();
