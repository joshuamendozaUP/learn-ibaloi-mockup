}

.form-select:not(:disabled):hover {
  background-color: color-mix(in srgb, var(--foreground) 6%, var(--secondary));
}

.form-select:focus-visible {
  border-color: var(--ring);
  box-shadow: inset 0 0 0 1px var(--ring);
}

.form-check {
  display: flex;
  min-height: 20px;
  align-items: center;
  gap: 6px;
}

.form-check-input {
  appearance: none;
  width: 14px;
  height: 14px;
  flex: 0 0 auto;
  margin: 0;
  border: 1px solid var(--input);
  color: var(--primary-foreground);
  background-color: transparent;
  cursor: var(--cursor-interaction, default);
  transition:
    background-color 150ms,
    border-color 150ms,
    box-shadow 150ms;
}

.form-check:not(.form-switch) .form-check-input[type=&quot;checkbox&quot;] {
  border-color: var(--input);
  border-radius: var(--radius-sm);
  corner-shape: var(--corner-shape);
  background-color: var(--secondary);
  box-shadow: var(--shadow-sm);
}

.form-check:not(.form-switch)
  .form-check-input:not(:disabled):not(:checked):hover {
  background-color: var(--card);
}

.form-check:not(.form-switch) .form-check-input[type=&quot;checkbox&quot;]:checked {
  border-color: var(--primary);
  background-color: var(--primary);
}

.form-check:not(.form-switch)
  .form-check-input[type=&quot;checkbox&quot;]:checked::before {
  display: block;
  width: 100%;
  height: 100%;
  background: var(--primary-foreground);
  content: &quot;&quot;;
  mask: var(--checkmark-image) center / 12px 12px no-repeat;
}

.form-check-input[type=&quot;radio&quot;] {
  width: 14px;
  height: 14px;
  border-radius: var(--radius-full);
}

.form-check-input[type=&quot;radio&quot;]:checked {
  border: 2px solid var(--primary);
  background:
    radial-gradient(circle, var(--primary-foreground) 0 2.5px, transparent 3px),
    var(--primary);
}

.form-check:not(.form-switch) .form-check-input:focus-visible {
  outline: 2px solid var(--ring);
  outline-offset: 2px;
}

.form-check:not(.form-switch) .form-check-input:disabled {
  cursor: not-allowed;
  pointer-events: none;
}

.form-check:not(.form-switch) .form-check-input:disabled + .form-check-label {
  cursor: not-allowed;
}

.form-switch .form-check-input:disabled,
.form-switch .form-check-input:disabled + .form-check-label {
  cursor: not-allowed;
  opacity: 0.6;
}

.form-check-label {
  color: var(--foreground);
  cursor: var(--cursor-interaction, default);
}

.form-switch .form-check-input {
  position: relative;
  width: 32px;
  height: 20px;
  border: 0;
  border-radius: var(--radius-full);
  background: var(--muted);
  box-shadow: none;
  transition: background-color 200ms cubic-bezier(0, 0, 0.2, 1);
}

.form-switch .form-check-input::before {
  position: absolute;
  top: 50%;
  left: 0;
  width: 16px;
  height: 16px;
  box-sizing: border-box;
  border: 1px solid light-dark(var(--primary-foreground), var(--foreground));
  border-radius: var(--radius-full);
  background: light-dark(var(--primary-foreground), var(--foreground));
  box-shadow: var(--shadow-sm);
  content: &quot;&quot;;
  transform: translate(2px, -50%);
  transition: transform 200ms cubic-bezier(0, 0, 0.2, 1);
}

.form-switch .form-check-input:checked {
  background: var(--primary);
}

.form-switch .form-check-input:checked::before {
  transform: translate(14px, -50%);
}

.form-switch .form-check-input:focus-visible {
  box-shadow: 0 0 0 2px var(--ring);
}

.form-range {
  appearance: none;
  display: block;
  width: 100%;
  height: 28px;
  flex: 1;
  margin: 0;
  padding: 0;
  outline: none;
  border: 0;
  accent-color: var(--primary);
  background: linear-gradient(
      color-mix(in srgb, var(--foreground) 7%, transparent),
      color-mix(in srgb, var(--foreground) 7%, transparent)
    )
    center / 100% 2px no-repeat;
}

.form-range::-webkit-slider-runnable-track {
  height: 28px;
  background: transparent;
}

.form-range::-webkit-slider-thumb {
  appearance: none;
  width: 20px;
  height: 20px;
  margin-top: 4px;
  border: 1px solid var(--border);
  border-radius: var(--radius-full);
  background: light-dark(var(--primary-foreground), var(--foreground));
}

.form-range:focus-visible::-webkit-slider-thumb {
  border-color: var(--ring);
  box-shadow: inset 0 0 0 1px var(--ring);
}

.form-range::-moz-range-track {
  height: 28px;
  background: transparent;
}

.form-range::-moz-range-thumb {
  width: 20px;
  height: 20px;
  border: 1px solid var(--border);
  border-radius: var(--radius-full);
  background: light-dark(var(--primary-foreground), var(--foreground));
}

.form-range:focus-visible::-moz-range-thumb {
  border-color: var(--ring);
  box-shadow: inset 0 0 0 1px var(--ring);
}

.form-range:disabled {
  cursor: not-allowed;
  opacity: 0.4;
}

.btn:not(.btn-primary, .viz-tile):is(
  [aria-pressed=&quot;true&quot;],
  [aria-selected=&quot;true&quot;],
  .is-selected
) {
  border-color: var(--primary);
  color: var(--primary-foreground);
  background: var(--primary);
}

.btn.viz-tile:is([aria-pressed=&quot;true&quot;], [aria-selected=&quot;true&quot;], .is-selected) {
  border-color: var(--primary);
  box-shadow: inset 0 0 0 1px var(--primary);
}

.btn:focus-visible,
.nav-link:focus-visible {
  outline: 2px solid var(--ring);
  outline-offset: 2px;
}

@media (pointer: coarse) {
  .btn,
  .nav-link,
  .form-control,
  .form-select {
    min-width: 44px;
    min-height: 44px;
  }

  /* Keep small-screen WebKit from zooming when a text field receives focus. */
  .form-control,
  .form-select {
    font-size: max(16px, var(--font-size-normal));
  }

  .form-control[type=&quot;file&quot;]::file-selector-button {
    min-width: 44px;
    min-height: 44px;
  }

  .form-control-color[type=&quot;color&quot;] {
    width: 44px;
    height: 44px;
  }

  .form-control:is(
    [type=&quot;date&quot;],
    [type=&quot;datetime-local&quot;],
    [type=&quot;month&quot;],
    [type=&quot;time&quot;],
    [type=&quot;week&quot;]
  ) {
    min-width: 0;
    max-width: 100%;
    padding-block: 8px;
  }

  .form-check {
    min-height: 44px;
    padding-inline: 15px;
  }

  .form-check-input {
    position: relative;
  }

  .form-check-input::after {
    position: absolute;
    top: 50%;
    left: 50%;
    width: 44px;
    height: 44px;
    content: &quot;&quot;;
    transform: translate(-50%, -50%);
  }

  .form-check-label {
    display: inline-flex;
    min-width: 44px;
    min-height: 44px;
    align-items: center;
  }

  .form-range {
    height: 44px;
    touch-action: pan-y;
  }

  .form-range::-webkit-slider-runnable-track {
    height: 44px;
  }

  .form-range::-moz-range-track {
    height: 44px;
  }

  .form-range::-webkit-slider-thumb {
    margin-top: 12px;
  }
}

svg {
  display: block;
  max-width: 100%;
  height: auto;
}

#widget &gt; svg {
  width: 100%;
}

/* Model-authored chart rules can otherwise stretch icons after these styles load. */
svg.lucide {
  display: block;
  width: var(--icon-size) !important;
  height: var(--icon-size) !important;
  flex: none;
  margin: 0 !important;
  stroke-width: 1.6;
}

.text-warning,
.text-destructive {
  color: var(--destructive);
}

      margin:0 auto;
      padding:20px;

      font-family:Arial, &quot;Helvetica Neue&quot;, sans-serif;
      box-sizing:border-box;
    }
    #ibaloiLearnerBrandedMockup * { box-sizing:border-box; }
    #ibaloiLearnerBrandedMockup button, #ibaloiLearnerBrandedMockup input, #ibaloiLearnerBrandedMockup textarea { font:inherit; }
    .ibm-topline { height:6px; margin:-20px -20px 18px; background:linear-gradient(90deg,var(--ibm-ink) 0 60%,var(--ibm-red) 60% 70%,var(--ibm-pine) 70% 74%,var(--ibm-ochre) 74% 76%,var(--ibm-cream) 76%); }
    .ibm-head { display:flex; justify-content:space-between; align-items:flex-start; gap:18px; padding:0 5px 16px; border-bottom:1px solid var(--ibm-mist); }
    .ibm-kicker { margin:0 0 5px; color:var(--ibm-red); font-size:10px; font-weight:700; letter-spacing:.14em; text-transform:uppercase; }
    .ibm-head h1 { margin:0; max-width:680px; font-size:clamp(23px,3.1vw,36px); line-height:1.05; letter-spacing:-.045em; }
    .ibm-head p { max-width:700px; margin:8px 0 0; color:var(--ibm-gray); font-size:12px; line-height:1.45; }
    .ibm-version { flex:0 0 auto; border:1px solid var(--ibm-red); padding:8px 10px; color:var(--ibm-red); font-size:9px; font-weight:700; letter-spacing:.08em; text-transform:uppercase; }
    .ibm-flowtabs { display:flex; flex-wrap:wrap; gap:5px; padding:0 0 15px; }
    .ibm-flowtabs button { border:1px solid var(--ibm-mist); border-radius:9px; padding:7px 9px; background:var(--ibm-paper); color:var(--ibm-gray); cursor:pointer; font-size:10px; font-weight:700; transition:background .2s ease,border-color .2s ease,transform .2s ease; }
    .ibm-flowtabs button:hover, .ibm-flowtabs button:focus-visible { border-color:var(--ibm-red); transform:translateY(-1px); }
    .ibm-flowtabs button[aria-selected=&quot;true&quot;] { border-color:var(--ibm-red); background:var(--ibm-red); color:var(--ibm-paper); }
    .ibm-layout { display:block; }
    .ibm-devicewrap { min-width:0; display:flex; justify-content:center; }
    .ibm-device { position:relative; width:min(380px,100%); min-height:675px; overflow:hidden; border:8px solid var(--ibm-ink); border-radius:34px; background:var(--ibm-paper); box-shadow:0 18px 40px rgba(24,23,22,.14); }
    .ibm-device:before { content:&quot;&quot;; position:absolute; top:6px; left:50%; width:84px; height:5px; transform:translateX(-50%); border-radius:99px; background:var(--ibm-ink); z-index:2; }
    .ibm-status { display:flex; justify-content:space-between; height:28px; padding:11px 16px 0; color:var(--ibm-gray); font-size:9px; font-weight:700; }
    .ibm-screen { min-height:625px; padding:12px 17px 60px; }
    .ibm-screen[hidden] { display:none; }
    .ibm-langbar { display:flex; align-items:center; justify-content:flex-end; gap:4px; padding:4px 17px 0; color:var(--ibm-gray); font-size:8px; }
    .ibm-langbar button { border:1px solid var(--ibm-mist); border-radius:99px; padding:5px 8px; background:var(--ibm-paper); color:var(--ibm-gray); cursor:pointer; font-size:8px; font-weight:700; }
    .ibm-langbar button[aria-pressed=&quot;true&quot;] { border-color:var(--ibm-red); background:var(--ibm-red); color:var(--ibm-paper); }
    .ibm-langnote { margin:8px 0 0; padding:7px 9px; border-radius:10px; background:var(--ibm-red-soft); color:var(--ibm-red); font-size:8px; line-height:1.35; }
    .ibm-langnote.ainu { background:var(--ibm-ochre-soft); color:var(--ibm-ink); }
    #ibaloiLearnerBrandedMockup.is-welcome .ibm-status,
    #ibaloiLearnerBrandedMockup.is-welcome .ibm-langbar,
    #ibaloiLearnerBrandedMockup.is-welcome .ibm-langnote,
    #ibaloiLearnerBrandedMockup.is-welcome .ibm-bottomnav { display:none; }
    #ibaloiLearnerBrandedMockup.is-home .ibm-status,
    #ibaloiLearnerBrandedMockup.is-home .ibm-langbar,
    #ibaloiLearnerBrandedMockup.is-home .ibm-langnote { display:none; }
    #ibaloiLearnerBrandedMockup.is-welcome .ibm-screen { min-height:675px; padding:0; }
    #ibaloiLearnerBrandedMockup.is-home .ibm-screen { min-height:675px; }
    #ibaloiLearnerBrandedMockup.is-welcome [data-pane=&quot;welcome&quot;] &gt; :not(.ibm-welcome-minimal) { display:none; }
    .ibm-welcome-minimal { position:relative; min-height:675px; display:flex; flex-direction:column; justify-content:center; overflow:hidden; padding:34px 24px; background:#210B0B; transition:background .28s ease; }
    .ibm-welcome-minimal:before { content:&quot;&quot;; position:absolute; inset:0; z-index:0; background-image:url(&quot;assets/ibaloi-textile-placeholder.png&quot;); background-position:center top; background-repeat:repeat; background-size:auto 168px; opacity:.98; }
    .ibm-welcome-minimal:after { content:&quot;&quot;; position:absolute; inset:0; z-index:1; background:linear-gradient(90deg, rgba(250,247,241,.96) 0 48%, rgba(250,247,241,.78) 68%, rgba(250,247,241,.22) 100%), repeating-linear-gradient(90deg, rgba(250,247,241,.11) 0 1px, transparent 1px 7px), linear-gradient(180deg, rgba(24,23,22,.08), transparent 28%, rgba(24,23,22,.14)); }
    #ibaloiLearnerBrandedMockup.lang-ainu .ibm-welcome-minimal { background:#0B3F52; }
    #ibaloiLearnerBrandedMockup.lang-ainu .ibm-welcome-minimal:before { background-image:url(&quot;assets/ainu-textile-placeholder.png&quot;); background-position:center top; background-size:cover; opacity:.9; }
    #ibaloiLearnerBrandedMockup.lang-ainu .ibm-welcome-minimal:after { background:linear-gradient(90deg, rgba(247,242,232,.96) 0 52%, rgba(247,242,232,.78) 76%, rgba(247,242,232,.42) 100%); }
    .ibm-welcome-minimal &gt; * { position:relative; z-index:3; }
    .ibm-welcome-minimal h2 { max-width:220px; margin:0; color:var(--ibm-ink); font-size:39px; line-height:1.02; letter-spacing:-.045em; }
    .ibm-welcome-minimal p { max-width:235px; margin:13px 0 0; color:var(--ibm-gray); font-size:18px; line-height:1.32; letter-spacing:-.015em; }
    .ibm-welcome-minimal .ibm-welcome-invite { margin-top:7px; color:var(--ibm-red); font-size:20px; font-weight:700; }
    .ibm-language-choices { display:grid; gap:10px; width:min(100%,245px); margin-top:31px; }
    .ibm-langchoice { width:100%; min-height:68px; display:flex; align-items:center; justify-content:space-between; gap:14px; border:1px solid var(--ibm-mist); border-radius:17px; padding:15px 16px; background:var(--ibm-soft); color:var(--ibm-ink); cursor:pointer; text-align:left; transition:transform .2s ease,border-color .2s ease,box-shadow .2s ease,background .2s ease; }

    .ibm-guides { display:grid; grid-template-columns:1fr; gap:8px; }
    .ibm-guide { display:grid; grid-template-columns:auto minmax(0,1fr); align-items:center; gap:11px; min-height:100px; overflow:hidden; padding:7px 10px; border:1px solid var(--ibm-mist); border-radius:13px; background:var(--ibm-paper); }
    .ibm-guide:first-child { display:none; }
    .ibm-guide img { width:64px; height:96px; object-fit:contain; flex:0 0 auto; border-radius:8px; }
    .ibm-guide figcaption { min-width:0; color:var(--ibm-gray); font-size:10px; line-height:1.35; }
    .ibm-guide figcaption strong { display:block; margin-bottom:4px; color:var(--ibm-ink); font-size:11px; line-height:1.2; }
    .ibm-guidenote { margin:7px 1px 0; color:var(--ibm-gray); font-size:8px; line-height:1.35; }
    .ibm-side { display:none; }
    .ibm-sidehead { display:flex; justify-content:space-between; align-items:baseline; gap:10px; margin:0 0 9px; }
    .ibm-sidehead h2 { margin:0; font-size:15px; letter-spacing:-.03em; }
    .ibm-sidehead span { color:var(--ibm-gray); font-size:9px; }
    .ibm-sidebox { padding:14px; border:1px solid var(--ibm-mist); border-radius:15px; background:var(--ibm-paper); box-shadow:0 5px 14px rgba(24,23,22,.04); }
    .ibm-sidebox + .ibm-sidebox { margin-top:10px; }
    .ibm-sidebox h3 { margin:0; font-size:13px; }
    .ibm-sidebox p { margin:5px 0 0; color:var(--ibm-gray); font-size:10px; line-height:1.4; }
    .ibm-sidegrid { display:grid; grid-template-columns:1fr 1fr; gap:8px; margin-top:12px; }
    .ibm-sideitem { padding:9px; border-left:3px solid var(--ibm-red); border-radius:0 9px 9px 0; background:var(--ibm-cream); }
    .ibm-sideitem:nth-child(2) { border-color:var(--ibm-pine); }
    .ibm-sideitem:nth-child(3) { border-color:var(--ibm-ochre); }
    .ibm-sideitem:nth-child(4) { border-color:var(--ibm-ink); }
    .ibm-sideitem b { display:block; font-size:9px; }
    .ibm-sideitem span { display:block; margin-top:4px; color:var(--ibm-gray); font-size:8px; line-height:1.3; }
    .ibm-voice { padding:12px; border-left:3px solid var(--ibm-pine); border-radius:0 12px 12px 0; background:var(--ibm-pine-soft); }
    .ibm-voice b { color:var(--ibm-pine); font-size:10px; }
    .ibm-voice p { margin:5px 0 0; color:var(--ibm-ink); font-size:10px; line-height:1.42; }
    .ibm-foot { margin:15px 5px 0; color:var(--ibm-gray); font-size:10px; line-height:1.4; }
    .ibm-foot strong { color:var(--ibm-ink); }
    @media (max-width:860px) {
      #ibaloiLearnerBrandedMockup { padding:14px; }
      .ibm-topline { margin:-14px -14px 16px; }
      .ibm-head { flex-direction:column; }
      .ibm-layout { grid-template-columns:1fr; }
      .ibm-side { order:2; }
    }
    @media (max-width:430px) {
      .ibm-layout { display:block; }
      .ibm-devicewrap { margin-bottom:15px; }
      .ibm-path { grid-template-columns:repeat(2,1fr); }
    }

      root.classList.toggle(&#x27;lang-ainu&#x27;, isAinu);

    if (nav) show(nav.dataset.screen);
    const choice = event.target.closest(&#x27;.ibm-choice&#x27;);
    if (choice) { root.querySelectorAll(&#x27;.ibm-choice&#x27;).forEach(button =&gt; button.classList.toggle(&#x27;is-selected&#x27;, button === choice)); }
    if (event.target.closest(&#x27;#ibmHearWord&#x27;)) event.target.closest(&#x27;#ibmHearWord&#x27;).textContent = &#x27;Playing · eguatan&#x27;;
    if (event.target.closest(&#x27;#ibmSaveWord&#x27;)) event.target.closest(&#x27;#ibmSaveWord&#x27;).textContent = &#x27;Saved&#x27;;
    if (event.target.closest(&#x27;#ibmTryAgain&#x27;)) event.target.closest(&#x27;#ibmTryAgain&#x27;).textContent = &#x27;Ready to respond&#x27;;
    if (event.target.closest(&#x27;#ibmTraceSource&#x27;)) event.target.closest(&#x27;#ibmTraceSource&#x27;).textContent = &#x27;Source shown&#x27;;
    if (event.target.closest(&#x27;#ibmStartStory&#x27;)) event.target.closest(&#x27;#ibmStartStory&#x27;).textContent = &#x27;Story playing · pause&#x27;;
  });
  show(&#x27;welcome&#x27;);
})();

&lt;script src=&quot;https://unpkg.com/@floating-ui/core@1.7.3/dist/floating-ui.core.umd.min.js&quot;&gt;&lt;/script&gt;
&lt;script src=&quot;https://unpkg.com/@floating-ui/dom@1.7.4/dist/floating-ui.dom.umd.min.js&quot;&gt;&lt;/script&gt;
&lt;script&gt;
(() =&gt; {
  if (window.FloatingUIDOM == null) {
    return;
  }
  const { autoUpdate, computePosition, flip, offset, shift, size } =
    window.FloatingUIDOM;
  const tooltipPlacements = new Set([&quot;top&quot;, &quot;right&quot;, &quot;bottom&quot;, &quot;left&quot;]);
  const tooltipId = `codex-visualization-tooltip-${
    window.crypto?.randomUUID?.() ?? Date.now().toString(36)
  }`;
  const tooltipGap = 5;
  const hoverDelay = 700;
  const skipDelay = 300;
  let activeTrigger = null;
  let pendingTrigger = null;
  let tooltip = null;
  let openTimeout = null;
  let autoUpdateCleanup = null;
  let positionRequest = 0;
  let skipDelayUntil = 0;
  let lastPointerWasTouch = false;
  let pinnedByTouch = false;

  const getTrigger = (target) =&gt;
    target?.nodeType === Node.ELEMENT_NODE
      ? target.closest(&quot;[data-tooltip]&quot;)
      : null;
  const containsTarget = (trigger, target) =&gt;
    target?.nodeType != null &amp;&amp; trigger.contains(target);
  const getContent = (trigger) =&gt;
    trigger.getAttribute(&quot;data-tooltip&quot;)?.trim() ?? &quot;&quot;;
  const getPlacement = (trigger) =&gt; {
    const placement = trigger.getAttribute(&quot;data-tooltip-placement&quot;);
    return tooltipPlacements.has(placement) ? placement : &quot;top&quot;;
  };
  const getTooltip = () =&gt; {
    if (tooltip == null) {
      tooltip = document.createElement(&quot;div&quot;);
      tooltip.id = tooltipId;
      tooltip.className = &quot;tooltip&quot;;
      tooltip.setAttribute(&quot;role&quot;, &quot;tooltip&quot;);
    }
    return tooltip;
  };
  const setDescribedBy = (trigger, described) =&gt; {
    const ids = new Set(
      (trigger.getAttribute(&quot;aria-describedby&quot;) ?? &quot;&quot;)
        .split(/\s+/)
        .filter(Boolean),
    );
    if (described) {
      ids.add(tooltipId);
    } else {
      ids.delete(tooltipId);
    }
    if (ids.size === 0) {
      trigger.removeAttribute(&quot;aria-describedby&quot;);
    } else {
      trigger.setAttribute(&quot;aria-describedby&quot;, [...ids].join(&quot; &quot;));
    }
  };
  const clearOpenTimeout = () =&gt; {
    if (openTimeout != null) {
      window.clearTimeout(openTimeout);
      openTimeout = null;
    }
    pendingTrigger = null;
  };
  const closeTooltip = (activateSkipDelay = true) =&gt; {
    clearOpenTimeout();
    pinnedByTouch = false;
    positionRequest += 1;
    autoUpdateCleanup?.();
    autoUpdateCleanup = null;
    if (activeTrigger == null) {
      return;
    }
    setDescribedBy(activeTrigger, false);
    activeTrigger = null;
    tooltip?.remove();
    if (activateSkipDelay) {
      skipDelayUntil = Date.now() + skipDelay;
    }
  };
  const updatePosition = (trigger, floating) =&gt; {
    const request = ++positionRequest;
    void computePosition(trigger, floating, {
      middleware: [
        offset(tooltipGap),
        flip({ padding: tooltipGap }),
        shift({ padding: tooltipGap }),
        size({
          padding: tooltipGap,
          apply({ availableHeight, availableWidth, elements }) {
            elements.floating.style.setProperty(
              &quot;--tooltip-available-width&quot;,
              `${Math.max(0, availableWidth)}px`,
            );
            elements.floating.style.setProperty(
              &quot;--tooltip-available-height&quot;,
              `${Math.max(0, availableHeight)}px`,
            );
          },
        }),
      ],
      placement: getPlacement(trigger),
      strategy: &quot;fixed&quot;,
    })
      .then(({ x, y }) =&gt; {
        if (activeTrigger !== trigger || request !== positionRequest) {
          return;
        }
        const scale = window.devicePixelRatio || 1;
        floating.style.transform = `translate(${Math.round(x * scale) / scale}px, ${Math.round(y * scale) / scale}px)`;
        floating.style.visibility = &quot;visible&quot;;
      })
      .catch(() =&gt; {
        if (activeTrigger === trigger &amp;&amp; request === positionRequest) {
          closeTooltip(false);
        }
      });
  };
  const openTooltip = (trigger) =&gt; {
    const content = getContent(trigger);
    if (!trigger.isConnected || content.length === 0) {
      return;
    }
    clearOpenTimeout();
    if (activeTrigger === trigger) {
      return;
    }
    closeTooltip();
    const floating = getTooltip();
    floating.textContent = content;
    floating.style.visibility = &quot;hidden&quot;;
    floating.style.transform = &quot;translate(0, 0)&quot;;
    document.body.appendChild(floating);
    activeTrigger = trigger;
    setDescribedBy(trigger, true);
    autoUpdateCleanup = autoUpdate(trigger, floating, () =&gt; {
      updatePosition(trigger, floating);
    });
  };
  const requestOpen = (trigger, immediate = false) =&gt; {
    if (
      getContent(trigger).length === 0 ||
      activeTrigger === trigger ||
      pendingTrigger === trigger
    ) {
      return;
    }
    clearOpenTimeout();
    pendingTrigger = trigger;
    const delay =
      immediate || activeTrigger != null || Date.now() &lt; skipDelayUntil
        ? 0
        : hoverDelay;
    if (delay === 0) {
      openTooltip(trigger);
      return;
    }
    openTimeout = window.setTimeout(() =&gt; {
      openTimeout = null;
      pendingTrigger = null;
      openTooltip(trigger);
    }, delay);
  };
  const handlePointerOpen = (event) =&gt; {
    if (event.pointerType === &quot;touch&quot;) {
      return;
    }
    const trigger = getTrigger(event.target);
    if (trigger == null || containsTarget(trigger, event.relatedTarget)) {
      return;
    }
    requestOpen(trigger);
  };
  const handlePointer = (event) =&gt; {
    lastPointerWasTouch =
      event.type === &quot;pointerdown&quot; &amp;&amp; event.pointerType === &quot;touch&quot;;
  };
  const handleTouchClick = (event) =&gt; {
    const isTouch = event.pointerType === &quot;touch&quot; || lastPointerWasTouch;
    lastPointerWasTouch = false;
    if (!isTouch || event.detail === 0) {
      return;
    }
    const trigger = getTrigger(event.target);
    if (
      trigger == null ||
      !trigger.isConnected ||
      getContent(trigger).length === 0 ||
      (pinnedByTouch &amp;&amp; activeTrigger === trigger)
    ) {
      if (pinnedByTouch) {
        closeTooltip();
      }
      return;
    }
    openTooltip(trigger);
    pinnedByTouch = activeTrigger === trigger;
    window.setTimeout(() =&gt; {
      if (activeTrigger === trigger &amp;&amp; !trigger.isConnected) {
        closeTooltip(false);
      }
    }, 0);
  };
  const handleLeave = (event) =&gt; {
    if (pinnedByTouch) {
      return;
    }
    const trigger = getTrigger(event.target);
    if (trigger == null || containsTarget(trigger, event.relatedTarget)) {
      return;
    }
    if (activeTrigger === trigger || pendingTrigger === trigger) {
      closeTooltip();
    }
  };
  const handleFocusIn = (event) =&gt; {
    const trigger = getTrigger(event.target);
    if (trigger?.matches(&quot;:focus-visible&quot;)) {
      requestOpen(trigger, true);
    }
  };
  const handleKeyDown = (event) =&gt; {
    if (event.key === &quot;Escape&quot;) {
      closeTooltip();
    }
  };
  const handleContextMenu = (event) =&gt; {
    lastPointerWasTouch = false;
    const trigger = getTrigger(event.target);
    if (activeTrigger === trigger || pendingTrigger === trigger) {
      closeTooltip();
    }
  };
  const destroy = () =&gt; {
    closeTooltip(false);
    lastPointerWasTouch = false;
    document.removeEventListener(&quot;pointerover&quot;, handlePointerOpen);
    document.removeEventListener(&quot;pointerdown&quot;, handlePointer);
    document.removeEventListener(&quot;pointercancel&quot;, handlePointer);
    document.removeEventListener(&quot;click&quot;, handleTouchClick);
    document.removeEventListener(&quot;pointerout&quot;, handleLeave);
    document.removeEventListener(&quot;focusin&quot;, handleFocusIn);
    document.removeEventListener(&quot;focusout&quot;, handleLeave);
    document.removeEventListener(&quot;keydown&quot;, handleKeyDown);
    document.removeEventListener(&quot;contextmenu&quot;, handleContextMenu);
    tooltip = null;
  };

  document.addEventListener(&quot;pointerover&quot;, handlePointerOpen);
  document.addEventListener(&quot;pointerdown&quot;, handlePointer);
  document.addEventListener(&quot;pointercancel&quot;, handlePointer);
  document.addEventListener(&quot;click&quot;, handleTouchClick);
  document.addEventListener(&quot;pointerout&quot;, handleLeave);
  document.addEventListener(&quot;focusin&quot;, handleFocusIn);
  document.addEventListener(&quot;focusout&quot;, handleLeave);
  document.addEventListener(&quot;keydown&quot;, handleKeyDown);
  document.addEventListener(&quot;contextmenu&quot;, handleContextMenu);
  window.addEventListener(&quot;pagehide&quot;, destroy, { once: true });
})();
&lt;/script&gt;
&lt;script id=&quot;codex-visualization-tabs&quot;&gt;
(() =&gt; {
  const selector = &#x27;.nav[role=&quot;tablist&quot;] [role=&quot;tab&quot;]&#x27;;
  const disabled = &#x27;:disabled,[aria-disabled=&quot;true&quot;]&#x27;;
  const selectTab = (selected) =&gt; {
    const panelId = selected.getAttribute(&quot;aria-controls&quot;);
    for (const tab of selected.closest(&#x27;[role=&quot;tablist&quot;]&#x27;).querySelectorAll(&#x27;[role=&quot;tab&quot;]&#x27;)) {
      const active = tab === selected;
      tab.classList.toggle(&quot;active&quot;, active);
      tab.setAttribute(&quot;aria-selected&quot;, String(active));
      const id = tab.getAttribute(&quot;aria-controls&quot;);
      const panel = id &amp;&amp; document.getElementById(id);
      if (panel != null) {
        panel.hidden = id !== panelId;
        if (!panel.hidden &amp;&amp; selected.id) {
          panel.setAttribute(&quot;aria-labelledby&quot;, selected.id);
        }
      }
    }
  };
  const interact = (event) =&gt; {
    const tab = event.target?.closest?.(selector);
    if (event.defaultPrevented || tab == null || tab.matches(disabled)) {
      return;
    }
    if (event.type === &quot;click&quot;) {
      selectTab(tab);
      return;
    }
    const tabs = Array.from(
      tab.closest(&#x27;[role=&quot;tablist&quot;]&#x27;).querySelectorAll(&#x27;[role=&quot;tab&quot;]&#x27;),
    ).filter((candidate) =&gt; !candidate.matches(disabled));
    const current = tabs.indexOf(tab);
    let next;
    if (event.key === &quot;ArrowRight&quot; || event.key === &quot;ArrowDown&quot;) {
      next = (current + 1) % tabs.length;
    } else if (event.key === &quot;ArrowLeft&quot; || event.key === &quot;ArrowUp&quot;) {
      next = (current + tabs.length - 1) % tabs.length;
    } else if (event.key === &quot;Home&quot;) {
      next = 0;
    } else if (event.key === &quot;End&quot;) {
      next = tabs.length - 1;
    } else {
      return;
    }
    event.preventDefault();
    tabs[next].focus();
    selectTab(tabs[next]);
  };

  for (const list of document.querySelectorAll(&#x27;.nav[role=&quot;tablist&quot;]&#x27;)) {
    const selected =
      list.querySelector(&#x27;[role=&quot;tab&quot;][aria-selected=&quot;true&quot;]&#x27;) ??
      list.querySelector(&#x27;[role=&quot;tab&quot;].active&#x27;) ??
      list.querySelector(&#x27;[role=&quot;tab&quot;]&#x27;);
    if (selected != null) {
      selectTab(selected);
    }
  }
  document.addEventListener(&quot;click&quot;, interact);
  document.addEventListener(&quot;keydown&quot;, interact);
  window.addEventListener(&quot;pagehide&quot;, () =&gt; {
    document.removeEventListener(&quot;click&quot;, interact);
    document.removeEventListener(&quot;keydown&quot;, interact);
  }, { once: true });
})();
&lt;/script&gt;
