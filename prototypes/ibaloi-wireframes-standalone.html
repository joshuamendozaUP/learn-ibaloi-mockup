:root[data-theme=&quot;light&quot;] {
  color-scheme: light;
}

:root[data-theme=&quot;dark&quot;] {
  color-scheme: dark;
}

* {
  box-sizing: border-box;
}

html &gt; body {
  /* Preserve MCP aliases for older inline renderers without creating :root cycles. */
  --color-background-primary: var(
    --background,
    light-dark(rgb(255 255 255), rgb(24 24 24))
  );
  --color-text-primary: var(
    --foreground,
    light-dark(rgb(26 28 31), rgb(255 255 255))
  );
  --color-border-secondary: var(
    --border,
    light-dark(rgb(26 28 31 / 8%), rgb(255 255 255 / 8.2%))
  );

  margin: 0;
  padding: 5px;
  color: var(--foreground);
  background: transparent !important;
  font-family: var(--font-sans) !important;
  font-size: var(--font-size-normal);
  font-weight: var(--font-weight-normal);
  line-height: var(--line-height-normal);
}

a {
  color: color-mix(in srgb, var(--viz-accent) 80%, var(--viz-text) 20%);
  cursor: pointer;
  font-weight: var(--font-weight-medium, 500);
  text-decoration: none;
  text-underline-offset: 2px;
}

a:is(:hover, :focus-visible) {
  text-decoration-line: underline;
  text-decoration-style: dashed;
  text-decoration-thickness: 0.5px;
}

h1,
h2,
h3,
h4,
h5,
h6,
p {
  margin-block: 0;
}

h1 {
  font-size: var(--font-size-h1);
  font-weight: var(--font-weight-medium);
  line-height: 1.25;
}

h2 {
  font-size: var(--font-size-h2);
  font-weight: var(--font-weight-medium);
  line-height: 1.25;
}

h3,
h4,
h5,
h6 {
  font-size: var(--font-size-h3);
  font-weight: var(--font-weight-medium);
  line-height: 1.3;
}

b,
strong,
th {
  font-weight: var(--font-weight-medium);
}

code:not(pre code) {
  display: inline;
  padding: 1px 6px;
  border-radius: var(--radius-sm);
  corner-shape: superellipse(1.5);
  background: var(--muted);
  font-family: var(--font-mono);
  font-size: 0.92em;
  overflow-wrap: anywhere;
  -webkit-box-decoration-break: clone;
  box-decoration-break: clone;
  word-break: break-word;
}

.table-responsive {
  width: 100%;
  overflow-x: auto;
  scrollbar-width: thin;
}

.table {
  width: 100%;
  border-collapse: collapse;
  color: var(--foreground);
  font: inherit;
  text-align: start;
}

.table :is(th, td) {
  padding-block: 10px;
  padding-inline: 0 24px;
  overflow-wrap: anywhere;
  border-bottom: 1px solid var(--border);
  text-align: start;
  vertical-align: top;
}

.table-responsive &gt; .table :is(th, td) {
  overflow-wrap: break-word;
}

.table :is(th, td):last-child {
  padding-inline-end: 0;
}

.table :is(caption, thead th) {
  font-weight: 600;
}

.table thead th {
  padding-block: 8px;
  border-bottom-color: color-mix(in srgb, var(--foreground) 16%, transparent);
}

.table tbody tr:last-child :is(th, td) {
  border-bottom: 0;
}

.table.table-sm :is(th, td) {
  padding-block: 6px;
}

.table.table-sm :is(th, td):not(:last-child) {
  padding-inline-end: 16px;
}

.table :is(.text-end, [align=&quot;right&quot;]) {
  text-align: end;
  font-variant-numeric: tabular-nums;
}

.table :is(.text-center, [align=&quot;center&quot;]) {
  text-align: center;
}

.table .text-nowrap {
  white-space: nowrap;
}

#widget {
  display: flex;
  flex-direction: column;
  gap: 12px;
  width: 100%;
  padding: 0;
  background: transparent !important;
}

.card {
  min-width: 0;
  padding: 12px;
  overflow: hidden;
  overflow-wrap: break-word;
  border-radius: var(--radius-2xl);
  corner-shape: superellipse(1.5);
  color: var(--card-foreground);
  background: var(--card);
}

#widget &gt; :not(.card, .progress) {
  width: 100% !important;
  max-width: none !important;
  margin: 0 !important;
  padding: 0 !important;
  border: 0 !important;
  border-radius: 0 !important;
  background: transparent !important;
  box-shadow: none !important;
}

.tooltip {
  position: fixed;
  z-index: 50;
  top: 0;
  left: 0;
  width: max-content;
  max-width: min(
    20rem,
    var(--tooltip-available-width, calc(100vw - 10px)),
    calc(100vw - 10px)
  );
  max-height: min(
    var(--tooltip-available-height, calc(100vh - 10px)),
    calc(100vh - 10px)
  );
  padding: 4px 8px;
  border: 1px solid var(--border);
  border-radius: var(--radius-lg);
  corner-shape: superellipse(1.5);
  color: var(--popover-foreground);
  background: var(--popover);
  box-shadow: none;
  font-size: var(--font-size-tooltip);
  line-height: var(--line-height-tooltip);
  overflow-wrap: break-word;
  white-space: normal;
  pointer-events: none;
  user-select: none;
}

.viz-grid {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(max(180px, 24%), 1fr));
  gap: 10px;
}

.viz-stat {
  display: flex;
  flex-direction: column;
  gap: 2px;
}

.viz-stat-value {
  font-size: var(--font-size-h2);
  font-weight: var(--font-weight-medium);
  line-height: 1.25;
}

.viz-row {
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  gap: 10px;
}

.progress {
  display: flex;
  height: 6px;
  margin-block: calc((var(--line-height-normal, 1.5em) - 6px) / 2);
  overflow: hidden;
  border: 0;
  border-radius: var(--radius-full);
  background: var(--muted);
}

.progress-bar {
  height: 100%;
  flex-shrink: 0;
  border: 0;
  background: var(--viz-series-1);
}

.viz-badge {
  padding: 3px 8px;
  border-radius: var(--radius-full);
  color: var(--accent-foreground);
  background: var(--accent);
  font-weight: var(--font-weight-medium);
}

small,
.text-small,
.viz-badge {
  font-size: var(--font-size-small);
  line-height: var(--line-height-small);
}

.text-muted {

}

.tabular-nums {
  font-variant-numeric: tabular-nums;
}

.sr-only {
  position: absolute;
  width: 1px;
  height: 1px;
  padding: 0;
  overflow: hidden;
  clip: rect(0, 0, 0, 0);
  white-space: nowrap;
  border: 0;
}

.viz-controls {
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  gap: 8px;
}

.viz-controls &gt; .form-label {
  display: grid;
  min-width: min(100%, 260px);
  flex: 1 1 280px;
  grid-template-columns: minmax(0, 1fr) auto;
  align-items: baseline;
  gap: 2px 12px;
  margin-bottom: 0;
}

.viz-controls &gt; .form-label &gt; :is(.form-control, .form-range, .form-select) {
  grid-column: 1 / -1;
}

.btn,
.form-check-input,
.form-control,
.form-range,
.form-select {
  font: inherit;
}

.btn {
  appearance: button;
  display: inline-flex;
  inline-size: fit-content;
  max-inline-size: 100%;
  min-height: 28px;
  align-items: center;

a.btn {

  text-decoration: none;

.btn:not(:disabled):hover {
  background: color-mix(in srgb, var(--foreground) 6%, var(--secondary));

  background: var(--foreground);
  background-clip: padding-box;

  cursor: not-allowed;
  opacity: 0.4;

[data-lucide] {

  margin-bottom: 6px;

  border: 1px solid var(--input);
  border-radius: var(--radius-lg);
  corner-shape: superellipse(1.5);

.form-range::-moz-range-track {

.form-range:focus-visible::-moz-range-thumb {

.form-range:disabled {

&lt;script&gt;
(() =&gt; {
  const root = document.getElementById(&#x27;ibaloiWireframes&#x27;);
  if (!root) return;
  const title = root.querySelector(&#x27;#iwScreenTitle&#x27;);
  const rightTitle = root.querySelector(&#x27;#iwRightTitle&#x27;);
  const rightHint = root.querySelector(&#x27;#iwViewHint&#x27;);
  const right = root.querySelector(&#x27;#iwRightContent&#x27;);
  const screenNames = {welcome:&#x27;01 · Welcome / consent&#x27;,home:&#x27;02 · Home / learning path&#x27;,ask:&#x27;03 · Ask Ibaloi&#x27;,builder:&#x27;04 · Sentence Builder&#x27;,story:&#x27;05 · Story / AR&#x27;,mentor:&#x27;06 · Mentor / live support&#x27;,review:&#x27;07 · Community governance&#x27;,research:&#x27;08 · Study mode&#x27;,vocab:&#x27;09 · Word Garden / MVP&#x27;};
  const viewHints = {learner:&#x27;Learner flow&#x27;,community:&#x27;Community authority flow&#x27;,research:&#x27;Study instrumentation&#x27;};
  const interactionNotes = {
    welcome:[&#x27;Introduce the community-governed premise before asking the learner to proceed.&#x27;,&#x27;Show language scope and the relationship between Ibaloi-first development and later Ainu co-design.&#x27;,&#x27;Offer a low-friction choice: learn independently or meet a human guide.&#x27;],
    home:[&#x27;Make the research model visible as a four-step journey: UNDERSTAND → CONSTRUCT → EXPERIENCE → SPEAK.&#x27;,&#x27;Keep the home screen action-oriented with four routes: Ask, Build, Story, People.&#x27;,&#x27;Progress is about practice, not an identity score.&#x27;],
    ask:[&#x27;Show the answer and its evidence together; source visibility is part of the learning experience.&#x27;,&#x27;Preserve locality and alternative forms instead of flattening variation.&#x27;,&#x27;When evidence or permission is insufficient, route to a human or refuse.&#x27;],
    builder:[&#x27;Use a bounded situation, not unrestricted translation.&#x27;,&#x27;Correction includes a short explanation and a validated source.&#x27;,&#x27;A learner can save the phrase for later practice and hear an approved example.&#x27;],
    story:[&#x27;Start with a small, approved story rather than a large virtual world.&#x27;,&#x27;Separate recording consent from playback, editing, AR/VR use, and model training.&#x27;,&#x27;After the story, ask for a response and provide language feedback without inventing cultural meaning.&#x27;],
    mentor:[&#x27;Human support is a first-class path for uncertainty, sensitive topics, and cultural interpretation.&#x27;,&#x27;Label human replies separately from AI replies.&#x27;,&#x27;Do not ingest live-chat content into the knowledge base without separate permission.&#x27;],
    review:[&#x27;Community authority is implemented as enforceable access and retrieval rules.&#x27;,&#x27;Every record carries source, locality, validation, and permission metadata.&#x27;,&#x27;Non-digitization and withholding are valid outcomes.&#x27;],
    research:[&#x27;Support pretest, posttest, and delayed posttest measurement.&#x27;,&#x27;Collect usage and experience data only with consent.&#x27;,&#x27;Keep language outcomes separate from identity, belonging, connection, and confidence measures.&#x27;]
    ,vocab:[&#x27;Make vocabulary practice small, repeatable, and connected to an approved word record.&#x27;,&#x27;Show part of speech, source, and review status before a learner uses a form.&#x27;,&#x27;Use recall and explanation instead of hearts, public ranking, or a proficiency score.&#x27;]
  };
  const noteMarkup = (items, code) =&gt; &#x27;&lt;div class=&quot;iw-review&quot; style=&quot;padding:15px&quot;&gt;&lt;div class=&quot;iw-reviewhead&quot; style=&quot;padding:0 0 11px&quot;&gt;&lt;div&gt;&lt;h3&gt;Interaction notes&lt;/h3&gt;&lt;p&gt;Product behavior implied by the study.&lt;/p&gt;&lt;/div&gt;&lt;span class=&quot;iw-statuspill&quot; style=&quot;background:#e9edff;color:#4e68c8&quot;&gt;&#x27;+code+&#x27;&lt;/span&gt;&lt;/div&gt;&#x27;+items.map((x,i)=&gt;&#x27;&lt;div class=&quot;iw-info&quot;&gt;&lt;span&gt;&#x27;+(i+1)+&#x27;&lt;/span&gt;&lt;span&gt;&#x27;+x+&#x27;&lt;/span&gt;&lt;/div&gt;&#x27;).join(&#x27;&#x27;)+&#x27;&lt;/div&gt;&#x27;;
  function showScreen(name) {
    root.querySelectorAll(&#x27;[data-pane]&#x27;).forEach(p =&gt; p.classList.toggle(&#x27;iw-hide&#x27;, p.getAttribute(&#x27;data-pane&#x27;) !== name));
    root.querySelectorAll(&#x27;.iw-tabs button&#x27;).forEach(b =&gt; b.setAttribute(&#x27;aria-pressed&#x27;, String(b.dataset.screen === name)));
    const navScreen = [&#x27;vocab&#x27;,&#x27;ask&#x27;,&#x27;story&#x27;,&#x27;mentor&#x27;].includes(name) ? name : &#x27;home&#x27;;
    root.querySelectorAll(&#x27;.iw-bottomnav button&#x27;).forEach(b =&gt; b.classList.toggle(&#x27;is-active&#x27;, b.dataset.screen === navScreen));
    title.textContent = screenNames[name] || screenNames.welcome;
    right.innerHTML = noteMarkup(interactionNotes[name] || interactionNotes.welcome, (name === &#x27;welcome&#x27; ? &#x27;01&#x27; : name === &#x27;home&#x27; ? &#x27;02&#x27; : name === &#x27;ask&#x27; ? &#x27;03&#x27; : name === &#x27;builder&#x27; ? &#x27;04&#x27; : name === &#x27;story&#x27; ? &#x27;05&#x27; : name === &#x27;mentor&#x27; ? &#x27;06&#x27; : name === &#x27;review&#x27; ? &#x27;07&#x27; : name === &#x27;research&#x27; ? &#x27;08&#x27; : &#x27;09&#x27;));
  }
  root.addEventListener(&#x27;click&#x27;, e =&gt; {
    const screenButton = e.target.closest(&#x27;[data-screen]&#x27;);
    if (screenButton) showScreen(screenButton.dataset.screen);
    const viewButton = e.target.closest(&#x27;[data-view]&#x27;);
    if (viewButton) { root.querySelectorAll(&#x27;[data-view]&#x27;).forEach(b=&gt;b.setAttribute(&#x27;aria-pressed&#x27;, String(b.dataset.view===viewButton.dataset.view))); rightHint.textContent=viewHints[viewButton.dataset.view] || &#x27;Learner flow&#x27;; }
    const wordCard = e.target.closest(&#x27;[data-word-term]&#x27;);
    if (wordCard) {
      root.querySelectorAll(&#x27;[data-word-term]&#x27;).forEach(card =&gt; { const selected = card === wordCard; card.classList.toggle(&#x27;is-selected&#x27;, selected); card.setAttribute(&#x27;aria-pressed&#x27;, String(selected)); });
      root.querySelector(&#x27;#iwWordTerm&#x27;).textContent = wordCard.dataset.wordTerm;
      root.querySelector(&#x27;#iwWordGloss&#x27;).textContent = wordCard.dataset.wordGloss;
      root.querySelector(&#x27;#iwWordPos&#x27;).textContent = wordCard.dataset.wordPos;
      root.querySelector(&#x27;#iwWordStatus&#x27;).textContent = wordCard.dataset.wordStatus;
      root.querySelector(&#x27;#iwWordAnswer&#x27;).classList.add(&#x27;iw-hide&#x27;);
      root.querySelector(&#x27;#iwRevealWord&#x27;).textContent = &#x27;Reveal meaning&#x27;;
      root.querySelector(&#x27;#iwSaveWord&#x27;).textContent = &#x27;Save to garden&#x27;;
    }
    if (e.target.closest(&#x27;#iwRevealWord&#x27;)) {
      const selected = root.querySelector(&#x27;[data-word-term].is-selected&#x27;) || root.querySelector(&#x27;[data-word-term]&#x27;);
      const answer = root.querySelector(&#x27;#iwWordAnswer&#x27;);
      answer.innerHTML = &#x27;&lt;b&gt;English gloss&lt;/b&gt;&lt;br&gt;&#x27;+selected.dataset.wordGloss+&#x27;&lt;br&gt;&lt;small&gt;&#x27;+selected.dataset.wordNote+&#x27;&lt;/small&gt;&#x27;;
      answer.classList.remove(&#x27;iw-hide&#x27;);
      root.querySelector(&#x27;#iwRevealWord&#x27;).textContent = &#x27;Meaning shown&#x27;;
    }
    if (e.target.closest(&#x27;#iwSaveWord&#x27;)) { e.target.closest(&#x27;#iwSaveWord&#x27;).textContent = &#x27;Saved to garden&#x27;; }
    if (e.target.closest(&#x27;#iwSourceToggle&#x27;)) root.querySelector(&#x27;#iwSourceBox&#x27;).classList.toggle(&#x27;is-open&#x27;);
    if (e.target.closest(&#x27;#iwSendAsk&#x27;)) { const m=root.querySelector(&#x27;.iw-messages&#x27;); m.insertAdjacentHTML(&#x27;beforeend&#x27;,&#x27;&lt;div class=&quot;iw-msg user&quot;&gt;Can you show another example?&lt;small&gt;You · just now&lt;/small&gt;&lt;/div&gt;&lt;div class=&quot;iw-msg ai&quot;&gt;I can look for another approved example, or route this to a representative if you want a local comparison.&lt;small&gt;AI answer · follow-up&lt;/small&gt;&lt;/div&gt;&#x27;); m.scrollTop=m.scrollHeight; }
    if (e.target.closest(&#x27;#iwCorrect&#x27;)) root.querySelector(&#x27;#iwCorrection&#x27;).innerHTML=&#x27;&lt;b&gt;Suggestion updated&lt;/b&gt;&lt;br&gt;Your sentence is understandable. Try the community-validated word order below for this situation, then listen and repeat.&lt;br&gt;&lt;small style=&quot;color:#4d806a&quot;&gt;Source: validated example · correction explained&lt;/small&gt;&#x27;;
    if (e.target.closest(&#x27;#iwStartStory&#x27;)) { e.target.closest(&#x27;#iwStartStory&#x27;).textContent=&#x27;Story playing · pause&#x27;; root.querySelector(&#x27;#iwStoryNote&#x27;).textContent=&#x27;Listen for the place word, then answer: “What did the speaker notice?” Your response can be in English first, then you can try the approved phrase.&#x27;; }
    if (e.target.closest(&#x27;#iwSendMentor&#x27;)) { const m=root.querySelector(&#x27;[data-pane=&quot;mentor&quot;] .iw-messages&#x27;); m.insertAdjacentHTML(&#x27;beforeend&#x27;,&#x27;&lt;div class=&quot;iw-msg user&quot;&gt;Thank you—I will practice the approved example.&lt;/div&gt;&#x27;); m.scrollTop=m.scrollHeight; }
    if (e.target.closest(&#x27;.iw-approve&#x27;)) { const b=e.target.closest(&#x27;.iw-approve&#x27;); b.textContent=&#x27;Queued&#x27;; b.style.color=&#x27;#2f7857&#x27;; b.style.borderColor=&#x27;#b9e1cf&#x27;; }
  });
  showScreen(&#x27;welcome&#x27;);
})();
&lt;/script&gt;

&lt;script src=&quot;https://unpkg.com/@floating-ui/core@1.7.3/dist/floating-ui.core.umd.min.js&quot;&gt;&lt;/script&gt;

&lt;script&gt;
(() =&gt; {
  if (window.FloatingUIDOM == null) {
    return;
  }
  const { autoUpdate, computePosition, flip, offset, shift, size } =
    window.FloatingUIDOM;
  const tooltipPlacements = new Set([&quot;top&quot;, &quot;right&quot;, &quot;bottom&quot;, &quot;left&quot;]);
  const tooltipId = `codex-visualization-tooltip-${
    window.crypto?.randomUUID?.() ?? Date.now().toString(36)
  }`;
  const tooltipGap = 5;
  const hoverDelay = 700;
  const skipDelay = 300;
  let activeTrigger = null;
  let pendingTrigger = null;
  let tooltip = null;
  let openTimeout = null;
  let autoUpdateCleanup = null;
  let positionRequest = 0;
  let skipDelayUntil = 0;
  let lastPointerWasTouch = false;
  let pinnedByTouch = false;

  const getTrigger = (target) =&gt;
    target?.nodeType === Node.ELEMENT_NODE
      ? target.closest(&quot;[data-tooltip]&quot;)
      : null;
  const containsTarget = (trigger, target) =&gt;
    target?.nodeType != null &amp;&amp; trigger.contains(target);
  const getContent = (trigger) =&gt;
    trigger.getAttribute(&quot;data-tooltip&quot;)?.trim() ?? &quot;&quot;;
  const getPlacement = (trigger) =&gt; {
    const placement = trigger.getAttribute(&quot;data-tooltip-placement&quot;);
    return tooltipPlacements.has(placement) ? placement : &quot;top&quot;;
  };
  const getTooltip = () =&gt; {
    if (tooltip == null) {
      tooltip = document.createElement(&quot;div&quot;);
      tooltip.id = tooltipId;
      tooltip.className = &quot;tooltip&quot;;
      tooltip.setAttribute(&quot;role&quot;, &quot;tooltip&quot;);
    }
    return tooltip;
  };
  const setDescribedBy = (trigger, described) =&gt; {
    const ids = new Set(
      (trigger.getAttribute(&quot;aria-describedby&quot;) ?? &quot;&quot;)
        .split(/\s+/)
        .filter(Boolean),
    );
    if (described) {
      ids.add(tooltipId);
    } else {
      ids.delete(tooltipId);
    }
    if (ids.size === 0) {
      trigger.removeAttribute(&quot;aria-describedby&quot;);
    } else {
      trigger.setAttribute(&quot;aria-describedby&quot;, [...ids].join(&quot; &quot;));
    }
  };
  const clearOpenTimeout = () =&gt; {
    if (openTimeout != null) {
      window.clearTimeout(openTimeout);
      openTimeout = null;
    }
    pendingTrigger = null;
  };
  const closeTooltip = (activateSkipDelay = true) =&gt; {
    clearOpenTimeout();
    pinnedByTouch = false;
    positionRequest += 1;
    autoUpdateCleanup?.();
    autoUpdateCleanup = null;
    if (activeTrigger == null) {
      return;
    }
    setDescribedBy(activeTrigger, false);
    activeTrigger = null;
    tooltip?.remove();
    if (activateSkipDelay) {
      skipDelayUntil = Date.now() + skipDelay;
    }
  };
  const updatePosition = (trigger, floating) =&gt; {
    const request = ++positionRequest;
    void computePosition(trigger, floating, {
      middleware: [
        offset(tooltipGap),
        flip({ padding: tooltipGap }),
        shift({ padding: tooltipGap }),
        size({
          padding: tooltipGap,
          apply({ availableHeight, availableWidth, elements }) {
            elements.floating.style.setProperty(
              &quot;--tooltip-available-width&quot;,
              `${Math.max(0, availableWidth)}px`,
            );
            elements.floating.style.setProperty(
              &quot;--tooltip-available-height&quot;,
              `${Math.max(0, availableHeight)}px`,
            );
          },
        }),
      ],
      placement: getPlacement(trigger),
      strategy: &quot;fixed&quot;,
    })
      .then(({ x, y }) =&gt; {
        if (activeTrigger !== trigger || request !== positionRequest) {
          return;
        }
        const scale = window.devicePixelRatio || 1;
        floating.style.transform = `translate(${Math.round(x * scale) / scale}px, ${Math.round(y * scale) / scale}px)`;
        floating.style.visibility = &quot;visible&quot;;
      })
      .catch(() =&gt; {
        if (activeTrigger === trigger &amp;&amp; request === positionRequest) {
          closeTooltip(false);
        }
      });
  };
  const openTooltip = (trigger) =&gt; {
    const content = getContent(trigger);
    if (!trigger.isConnected || content.length === 0) {
      return;
    }
    clearOpenTimeout();
    if (activeTrigger === trigger) {
      return;
    }
    closeTooltip();
    const floating = getTooltip();
    floating.textContent = content;
    floating.style.visibility = &quot;hidden&quot;;
    floating.style.transform = &quot;translate(0, 0)&quot;;
    document.body.appendChild(floating);
    activeTrigger = trigger;
    setDescribedBy(trigger, true);
    autoUpdateCleanup = autoUpdate(trigger, floating, () =&gt; {
      updatePosition(trigger, floating);
    });
  };
  const requestOpen = (trigger, immediate = false) =&gt; {
    if (
      getContent(trigger).length === 0 ||
      activeTrigger === trigger ||
      pendingTrigger === trigger
    ) {
      return;
    }
    clearOpenTimeout();
    pendingTrigger = trigger;
    const delay =
      immediate || activeTrigger != null || Date.now() &lt; skipDelayUntil
        ? 0
        : hoverDelay;
    if (delay === 0) {
      openTooltip(trigger);
      return;
    }
    openTimeout = window.setTimeout(() =&gt; {
      openTimeout = null;
      pendingTrigger = null;
      openTooltip(trigger);
    }, delay);
  };

    if (event.pointerType === &quot;touch&quot;) {
      return;
    }
    const trigger = getTrigger(event.target);

    }

      event.type === &quot;pointerdown&quot; &amp;&amp; event.pointerType === &quot;touch&quot;;

    const isTouch = event.pointerType === &quot;touch&quot; || lastPointerWasTouch;
    lastPointerWasTouch = false;
    if (!isTouch || event.detail === 0) {
      return;
    }

    if (
      trigger == null ||
      !trigger.isConnected ||
      getContent(trigger).length === 0 ||
