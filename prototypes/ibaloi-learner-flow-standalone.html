html &gt; body {
  /* Preserve MCP aliases for older inline renderers without creating :root cycles. */

    --background,
    light-dark(rgb(255 255 255), rgb(24 24 24))
  );
  --color-text-primary: var(
    --foreground,
    light-dark(rgb(26 28 31), rgb(255 255 255))

b,

  .form-check-input:not(:disabled):not(:checked):hover {
  background-color: var(--card);
}

.form-check:not(.form-switch) .form-check-input[type=&quot;checkbox&quot;]:checked {
  border-color: var(--primary);
  background-color: var(--primary);
}

.form-check:not(.form-switch)
  .form-check-input[type=&quot;checkbox&quot;]:checked::before {
  display: block;
  width: 100%;
  height: 100%;
  background: var(--primary-foreground);
  content: &quot;&quot;;
  mask: var(--checkmark-image) center / 12px 12px no-repeat;
}

.form-check-input[type=&quot;radio&quot;] {
  width: 14px;
  height: 14px;
  border-radius: var(--radius-full);
}

.form-check-input[type=&quot;radio&quot;]:checked {
  border: 2px solid var(--primary);
  background:
    radial-gradient(circle, var(--primary-foreground) 0 2.5px, transparent 3px),
    var(--primary);
}

.form-check:not(.form-switch) .form-check-input:focus-visible {
  outline: 2px solid var(--ring);
  outline-offset: 2px;
}

.form-check:not(.form-switch) .form-check-input:disabled {
  cursor: not-allowed;
  pointer-events: none;
}

.form-check:not(.form-switch) .form-check-input:disabled + .form-check-label {
  cursor: not-allowed;
}

.form-switch .form-check-input:disabled,
.form-switch .form-check-input:disabled + .form-check-label {
  cursor: not-allowed;
  opacity: 0.6;
}

.form-check-label {
  color: var(--foreground);
  cursor: var(--cursor-interaction, default);
}

.form-switch .form-check-input {
  position: relative;
  width: 32px;
  height: 20px;
  border: 0;
  border-radius: var(--radius-full);
  background: var(--muted);
  box-shadow: none;
  transition: background-color 200ms cubic-bezier(0, 0, 0.2, 1);
}

.form-switch .form-check-input::before {
  position: absolute;
  top: 50%;
  left: 0;
  width: 16px;
  height: 16px;
  box-sizing: border-box;
  border: 1px solid light-dark(var(--primary-foreground), var(--foreground));
  border-radius: var(--radius-full);
  background: light-dark(var(--primary-foreground), var(--foreground));
  box-shadow: var(--shadow-sm);
  content: &quot;&quot;;
  transform: translate(2px, -50%);
  transition: transform 200ms cubic-bezier(0, 0, 0.2, 1);
}

.form-switch .form-check-input:checked {
  background: var(--primary);
}

.form-switch .form-check-input:checked::before {
  transform: translate(14px, -50%);
}

.form-switch .form-check-input:focus-visible {
  box-shadow: 0 0 0 2px var(--ring);
}

.form-range {
  appearance: none;
  display: block;
  width: 100%;
  height: 28px;
  flex: 1;
  margin: 0;
  padding: 0;
  outline: none;
  border: 0;
  accent-color: var(--primary);
  background: linear-gradient(
      color-mix(in srgb, var(--foreground) 7%, transparent),
      color-mix(in srgb, var(--foreground) 7%, transparent)
    )
    center / 100% 2px no-repeat;
}

.form-range::-webkit-slider-runnable-track {
  height: 28px;
  background: transparent;
}

.form-range::-webkit-slider-thumb {
  appearance: none;
  width: 20px;
  height: 20px;
  margin-top: 4px;
  border: 1px solid var(--border);
  border-radius: var(--radius-full);
  background: light-dark(var(--primary-foreground), var(--foreground));
}

.form-range:focus-visible::-webkit-slider-thumb {
  border-color: var(--ring);
  box-shadow: inset 0 0 0 1px var(--ring);
}

.form-range::-moz-range-track {
  height: 28px;
  background: transparent;
}

.form-range::-moz-range-thumb {
  width: 20px;
  height: 20px;
  border: 1px solid var(--border);
  border-radius: var(--radius-full);
  background: light-dark(var(--primary-foreground), var(--foreground));
}

.form-range:focus-visible::-moz-range-thumb {
  border-color: var(--ring);
  box-shadow: inset 0 0 0 1px var(--ring);
}

.form-range:disabled {
  cursor: not-allowed;
  opacity: 0.4;
}

.btn:not(.btn-primary, .viz-tile):is(
  [aria-pressed=&quot;true&quot;],
  [aria-selected=&quot;true&quot;],
  .is-selected
) {
  border-color: var(--primary);
  color: var(--primary-foreground);
  background: var(--primary);
}

.btn.viz-tile:is([aria-pressed=&quot;true&quot;], [aria-selected=&quot;true&quot;], .is-selected) {
  border-color: var(--primary);
  box-shadow: inset 0 0 0 1px var(--primary);
}

.btn:focus-visible {
  outline: 2px solid var(--ring);
  outline-offset: 2px;
}

@media (pointer: coarse) {
  .btn,
  .form-control,
  .form-select {
    min-width: 44px;
    min-height: 44px;
  }

  .form-control,
  .form-select {
    font-size: max(16px, var(--font-size-normal));
  }

  .form-control[type=&quot;file&quot;]::file-selector-button {

    min-height: 44px;
  }

  .form-control-color[type=&quot;color&quot;] {
    width: 44px;
    height: 44px;
  }

    [type=&quot;datetime-local&quot;],
    [type=&quot;month&quot;],
    [type=&quot;time&quot;],
    [type=&quot;week&quot;]
  ) {
    min-width: 0;
    max-width: 100%;
    padding-block: 8px;
  }

  .form-check {
    min-height: 44px;
    padding-inline: 15px;
  }

  .form-check-input {
    position: relative;
  }

  .form-check-input::after {
    position: absolute;
    top: 50%;
    left: 50%;
    width: 44px;
    height: 44px;
    content: &quot;&quot;;
    transform: translate(-50%, -50%);
  }

  .form-check-label {
    display: inline-flex;
    min-width: 44px;
    min-height: 44px;
    align-items: center;
  }

  .form-range {
    height: 44px;

  }

  .form-range::-webkit-slider-runnable-track {
    height: 44px;
  }

  .form-range::-moz-range-track {
    height: 44px;
  }

  .form-range::-webkit-slider-thumb {
    margin-top: 12px;
  }
}

svg {

#widget &gt; svg {

svg.lucide {

.text-warning,
.text-destructive {

    #ibaloiLearnerFlow {

&lt;script&gt;
(() =&gt; {
  const root = document.getElementById(&#x27;ibaloiLearnerFlow&#x27;);
  if (!root) return;
  const steps = {
    welcome: {step:&#x27;01&#x27;, title:&#x27;Welcome / consent&#x27;, subtitle:&#x27;Trust comes before practice.&#x27;, action:&#x27;Choose whether to continue independently or ask for a human guide.&#x27;, response:&#x27;Explain language scope, community authority, permissions, and what the app can—and cannot—answer.&#x27;, decision:&#x27;Continue as learner → choose a purpose and context.&#x27;, boundary:&#x27;No universal greeting is implied. Guidebook draft wording stays marked for community review.&#x27;, callout:&#x27;the first screen establishes a relationship with the language community, not a game score.&#x27;},
    context: {step:&#x27;02&#x27;, title:&#x27;Purpose and context&#x27;, subtitle:&#x27;The learner chooses a situation, not an identity label.&#x27;, action:&#x27;Select why they want to learn and, when appropriate, the setting or locality.&#x27;, response:&#x27;Shape examples, vocabulary, and practice situations without treating one variety as universal.&#x27;, decision:&#x27;Set my path → see a small daily route.&#x27;, boundary:&#x27;Purpose and locality are learning context; they are not used to score cultural belonging.&#x27;, callout:&#x27;the learner’s reason for learning drives the path more than a generic level number.&#x27;},
    today: {step:&#x27;03&#x27;, title:&#x27;Today’s path&#x27;, subtitle:&#x27;One small practice rhythm.&#x27;, action:&#x27;Choose one short route: words, a situation, or an approved story.&#x27;, response:&#x27;Offer a clear next step and show practice rhythm instead of XP or a public ranking.&#x27;, decision:&#x27;Start small → Word Garden, practice, or an optional question.&#x27;, boundary:&#x27;Missing a day never erases progress; the rhythm is encouragement, not pressure.&#x27;, callout:&#x27;the home screen is a calm launch point, not a dashboard full of scores.&#x27;},
    garden: {step:&#x27;04&#x27;, title:&#x27;Word Garden&#x27;, subtitle:&#x27;Vocabulary stays attached to evidence.&#x27;, action:&#x27;Tap a word, reveal its meaning, hear it, and save it for review.&#x27;, response:&#x27;Show part of speech, English gloss, source, locality when known, permission, and review status.&#x27;, decision:&#x27;Practice the word → move into a situation-based activity.&#x27;, boundary:&#x27;Draft translations are not presented as final or universal forms.&#x27;, callout:&#x27;a vocabulary section becomes a provenance-aware memory space—not a list of decontextualized points.&#x27;},
    practice: {step:&#x27;05&#x27;, title:&#x27;Practice loop&#x27;, subtitle:&#x27;Hear → understand → use → reflect.&#x27;, action:&#x27;Listen, recall, arrange or choose, say the word, and try again with an explanation.&#x27;, response:&#x27;Give a grounded correction and make uncertainty visible; avoid punitive hearts or accent scores.&#x27;, decision:&#x27;Try again, save the phrase, ask a question, or choose a story.&#x27;, boundary:&#x27;Automated feedback supports practice but does not decide cultural correctness.&#x27;, callout:&#x27;familiar micro-lessons are useful here, but the goal is confident use in context.&#x27;},
    ask: {step:&#x27;06&#x27;, title:&#x27;Ask Ibaloi&#x27;, subtitle:&#x27;A question can end in evidence or human help.&#x27;, action:&#x27;Ask about a phrase, relationship, place, or situation.&#x27;, response:&#x27;Show validated examples, possible local variation, source trace, and a route to a representative when evidence is insufficient.&#x27;, decision:&#x27;Use the example, compare a variation, or ask a mentor.&#x27;, boundary:&#x27;The app can refuse to guess and never silently standardizes a locality.&#x27;, callout:&#x27;uncertainty is a visible learning state, not a failure message.&#x27;},
    story: {step:&#x27;07&#x27;, title:&#x27;Story / place&#x27;, subtitle:&#x27;Language is encountered with people and place.&#x27;, action:&#x27;Listen to an approved story, view its context, and respond in English or Ibaloi.&#x27;, response:&#x27;Show permission level, locality, contributor credit, transcript, and listening controls.&#x27;, decision:&#x27;Reflect on the story → save language practice or ask for context.&#x27;, boundary:&#x27;Sensitive stories are not unlocked through points; access follows community permission.&#x27;, callout:&#x27;stories provide meaning and belonging without asking the learner to perform cultural expertise.&#x27;},
    reflect: {step:&#x27;08&#x27;, title:&#x27;Reflect and continue&#x27;, subtitle:&#x27;Progress includes confidence and connection.&#x27;, action:&#x27;Record what felt easy, difficult, useful, or worth revisiting.&#x27;, response:&#x27;Offer retry, save, mentor support, and a next small step; share research data only with consent.&#x27;, decision:&#x27;Continue the rhythm, revisit a word, or request human help.&#x27;, boundary:&#x27;Language performance is measured separately from belonging, connection, confidence, and willingness to use Ibaloi.&#x27;, callout:&#x27;reflection closes the loop and gives the learner agency over what happens next.&#x27;}
  };
  const title = root.querySelector(&#x27;#ilfDetailTitle&#x27;);
  const subtitle = root.querySelector(&#x27;#ilfDetailSubtitle&#x27;);
  const badge = root.querySelector(&#x27;#ilfDetailStep&#x27;);
  const grid = root.querySelector(&#x27;#ilfDetailGrid&#x27;);
  const callout = root.querySelector(&#x27;#ilfDetailCallout&#x27;);
  function selectStep(name) {
    const data = steps[name] || steps.welcome;
    root.querySelectorAll(&#x27;[data-step]&#x27;).forEach(button =&gt; {
      const selected = button.dataset.step === name;
      button.classList.toggle(&#x27;is-selected&#x27;, selected);
      button.setAttribute(&#x27;aria-pressed&#x27;, String(selected));

    title.textContent = data.title;
    subtitle.textContent = data.subtitle;
    badge.textContent = data.step;
    grid.innerHTML = &#x27;&lt;div class=&quot;ilf-detailitem&quot;&gt;&lt;label&gt;Learner action&lt;/label&gt;&lt;div&gt;&#x27;+data.action+&#x27;&lt;/div&gt;&lt;/div&gt;&lt;div class=&quot;ilf-detailitem&quot;&gt;&lt;label&gt;System response&lt;/label&gt;&lt;div&gt;&#x27;+data.response+&#x27;&lt;/div&gt;&lt;/div&gt;&lt;div class=&quot;ilf-detailitem&quot;&gt;&lt;label&gt;Decision point&lt;/label&gt;&lt;div class=&quot;ilf-mutedcopy&quot;&gt;&#x27;+data.decision+&#x27;&lt;/div&gt;&lt;/div&gt;&lt;div class=&quot;ilf-detailitem&quot;&gt;&lt;label&gt;Design boundary&lt;/label&gt;&lt;div class=&quot;ilf-mutedcopy&quot;&gt;&#x27;+data.boundary+&#x27;&lt;/div&gt;&lt;/div&gt;&#x27;;
    callout.innerHTML = &#x27;&lt;strong&gt;Why this is different:&lt;/strong&gt; &#x27;+data.callout;
  }
  root.addEventListener(&#x27;click&#x27;, event =&gt; {
    const button = event.target.closest(&#x27;[data-step]&#x27;);
    if (button) selectStep(button.dataset.step);
  });
  selectStep(&#x27;welcome&#x27;);
})();

&lt;script src=&quot;https://unpkg.com/@floating-ui/core@1.7.3/dist/floating-ui.core.umd.min.js&quot;&gt;&lt;/script&gt;
&lt;script src=&quot;https://unpkg.com/@floating-ui/dom@1.7.4/dist/floating-ui.dom.umd.min.js&quot;&gt;&lt;/script&gt;
&lt;script&gt;
(() =&gt; {
  if (window.FloatingUIDOM == null) {
    return;
  }
  const { autoUpdate, computePosition, flip, offset, shift, size } =
    window.FloatingUIDOM;
  const tooltipPlacements = new Set([&quot;top&quot;, &quot;right&quot;, &quot;bottom&quot;, &quot;left&quot;]);
  const tooltipId = `codex-visualization-tooltip-${
    window.crypto?.randomUUID?.() ?? Date.now().toString(36)
  }`;
  const tooltipGap = 5;
  const hoverDelay = 700;
  const skipDelay = 300;
  let activeTrigger = null;
  let pendingTrigger = null;
  let tooltip = null;
  let openTimeout = null;
  let autoUpdateCleanup = null;
  let positionRequest = 0;
  let skipDelayUntil = 0;
  let lastPointerWasTouch = false;
  let pinnedByTouch = false;

  const getTrigger = (target) =&gt;
    target?.nodeType === Node.ELEMENT_NODE
      ? target.closest(&quot;[data-tooltip]&quot;)
      : null;
  const containsTarget = (trigger, target) =&gt;
    target?.nodeType != null &amp;&amp; trigger.contains(target);
  const getContent = (trigger) =&gt;
    trigger.getAttribute(&quot;data-tooltip&quot;)?.trim() ?? &quot;&quot;;
  const getPlacement = (trigger) =&gt; {
    const placement = trigger.getAttribute(&quot;data-tooltip-placement&quot;);
    return tooltipPlacements.has(placement) ? placement : &quot;top&quot;;
  };
  const getTooltip = () =&gt; {
    if (tooltip == null) {
      tooltip = document.createElement(&quot;div&quot;);
      tooltip.id = tooltipId;
      tooltip.className = &quot;tooltip&quot;;
      tooltip.setAttribute(&quot;role&quot;, &quot;tooltip&quot;);
    }
    return tooltip;
  };
  const setDescribedBy = (trigger, described) =&gt; {
    const ids = new Set(
      (trigger.getAttribute(&quot;aria-describedby&quot;) ?? &quot;&quot;)
        .split(/\s+/)
        .filter(Boolean),
    );
    if (described) {
      ids.add(tooltipId);
    } else {
      ids.delete(tooltipId);
    }
    if (ids.size === 0) {
      trigger.removeAttribute(&quot;aria-describedby&quot;);
    } else {
      trigger.setAttribute(&quot;aria-describedby&quot;, [...ids].join(&quot; &quot;));
    }
  };
  const clearOpenTimeout = () =&gt; {
    if (openTimeout != null) {
      window.clearTimeout(openTimeout);
      openTimeout = null;
    }
    pendingTrigger = null;
  };
  const closeTooltip = (activateSkipDelay = true) =&gt; {
    clearOpenTimeout();
    pinnedByTouch = false;
    positionRequest += 1;
    autoUpdateCleanup?.();
    autoUpdateCleanup = null;
    if (activeTrigger == null) {
      return;
    }
    setDescribedBy(activeTrigger, false);
    activeTrigger = null;
    tooltip?.remove();
    if (activateSkipDelay) {
      skipDelayUntil = Date.now() + skipDelay;
    }
  };
  const updatePosition = (trigger, floating) =&gt; {
    const request = ++positionRequest;
    void computePosition(trigger, floating, {
      middleware: [
        offset(tooltipGap),
        flip({ padding: tooltipGap }),
        shift({ padding: tooltipGap }),
        size({
          padding: tooltipGap,
          apply({ availableHeight, availableWidth, elements }) {
            elements.floating.style.setProperty(
              &quot;--tooltip-available-width&quot;,
              `${Math.max(0, availableWidth)}px`,
            );
            elements.floating.style.setProperty(
              &quot;--tooltip-available-height&quot;,
              `${Math.max(0, availableHeight)}px`,
            );
          },
        }),
      ],
      placement: getPlacement(trigger),
      strategy: &quot;fixed&quot;,
    })
      .then(({ x, y }) =&gt; {
        if (activeTrigger !== trigger || request !== positionRequest) {
          return;
        }
        const scale = window.devicePixelRatio || 1;
        floating.style.transform = `translate(${Math.round(x * scale) / scale}px, ${Math.round(y * scale) / scale}px)`;
        floating.style.visibility = &quot;visible&quot;;
      })
      .catch(() =&gt; {
        if (activeTrigger === trigger &amp;&amp; request === positionRequest) {
          closeTooltip(false);
        }
      });
  };
  const openTooltip = (trigger) =&gt; {
    const content = getContent(trigger);
    if (!trigger.isConnected || content.length === 0) {
      return;
    }
    clearOpenTimeout();
    if (activeTrigger === trigger) {
      return;
    }
    closeTooltip();
    const floating = getTooltip();
    floating.textContent = content;
    floating.style.visibility = &quot;hidden&quot;;
    floating.style.transform = &quot;translate(0, 0)&quot;;
    document.body.appendChild(floating);
    activeTrigger = trigger;
    setDescribedBy(trigger, true);
    autoUpdateCleanup = autoUpdate(trigger, floating, () =&gt; {
      updatePosition(trigger, floating);
    });
  };
  const requestOpen = (trigger, immediate = false) =&gt; {
    if (
      getContent(trigger).length === 0 ||
      activeTrigger === trigger ||
      pendingTrigger === trigger
    ) {
      return;
    }
    clearOpenTimeout();
    pendingTrigger = trigger;
    const delay =
      immediate || activeTrigger != null || Date.now() &lt; skipDelayUntil
        ? 0
        : hoverDelay;
    if (delay === 0) {
      openTooltip(trigger);
      return;
    }
    openTimeout = window.setTimeout(() =&gt; {
      openTimeout = null;
      pendingTrigger = null;
      openTooltip(trigger);
    }, delay);
  };
  const handlePointerOpen = (event) =&gt; {
    if (event.pointerType === &quot;touch&quot;) {
      return;
    }
    const trigger = getTrigger(event.target);
    if (trigger == null || containsTarget(trigger, event.relatedTarget)) {
      return;
    }
    requestOpen(trigger);
  };
  const handlePointer = (event) =&gt; {
    lastPointerWasTouch =
      event.type === &quot;pointerdown&quot; &amp;&amp; event.pointerType === &quot;touch&quot;;
  };
  const handleTouchClick = (event) =&gt; {
    const isTouch = event.pointerType === &quot;touch&quot; || lastPointerWasTouch;
    lastPointerWasTouch = false;
    if (!isTouch || event.detail === 0) {
      return;
    }
    const trigger = getTrigger(event.target);
    if (
      trigger == null ||
      !trigger.isConnected ||
      getContent(trigger).length === 0 ||
      (pinnedByTouch &amp;&amp; activeTrigger === trigger)
    ) {
      if (pinnedByTouch) {
        closeTooltip();
      }
      return;
    }
    openTooltip(trigger);
    pinnedByTouch = activeTrigger === trigger;
    window.setTimeout(() =&gt; {
      if (activeTrigger === trigger &amp;&amp; !trigger.isConnected) {
        closeTooltip(false);
      }
    }, 0);
  };
  const handleLeave = (event) =&gt; {
    if (pinnedByTouch) {
      return;
    }
    const trigger = getTrigger(event.target);
    if (trigger == null || containsTarget(trigger, event.relatedTarget)) {
      return;
    }
    if (activeTrigger === trigger || pendingTrigger === trigger) {
      closeTooltip();
    }
  };
  const handleFocusIn = (event) =&gt; {
    const trigger = getTrigger(event.target);
    if (trigger?.matches(&quot;:focus-visible&quot;)) {
      requestOpen(trigger, true);
    }
  };
  const handleKeyDown = (event) =&gt; {
    if (event.key === &quot;Escape&quot;) {
      closeTooltip();
    }
  };
  const handleContextMenu = (event) =&gt; {
    lastPointerWasTouch = false;
    const trigger = getTrigger(event.target);
    if (activeTrigger === trigger || pendingTrigger === trigger) {
      closeTooltip();
    }
  };
  const destroy = () =&gt; {
    closeTooltip(false);
    lastPointerWasTouch = false;
    document.removeEventListener(&quot;pointerover&quot;, handlePointerOpen);
    document.removeEventListener(&quot;pointerdown&quot;, handlePointer);
    document.removeEventListener(&quot;pointercancel&quot;, handlePointer);
    document.removeEventListener(&quot;click&quot;, handleTouchClick);
    document.removeEventListener(&quot;pointerout&quot;, handleLeave);
    document.removeEventListener(&quot;focusin&quot;, handleFocusIn);
    document.removeEventListener(&quot;focusout&quot;, handleLeave);
    document.removeEventListener(&quot;keydown&quot;, handleKeyDown);
    document.removeEventListener(&quot;contextmenu&quot;, handleContextMenu);
    tooltip = null;
  };

  document.addEventListener(&quot;pointerover&quot;, handlePointerOpen);
  document.addEventListener(&quot;pointerdown&quot;, handlePointer);
  document.addEventListener(&quot;pointercancel&quot;, handlePointer);
  document.addEventListener(&quot;click&quot;, handleTouchClick);
  document.addEventListener(&quot;pointerout&quot;, handleLeave);
  document.addEventListener(&quot;focusin&quot;, handleFocusIn);
  document.addEventListener(&quot;focusout&quot;, handleLeave);
  document.addEventListener(&quot;keydown&quot;, handleKeyDown);
  document.addEventListener(&quot;contextmenu&quot;, handleContextMenu);
  window.addEventListener(&quot;pagehide&quot;, destroy, { once: true });
})();
&lt;/script&gt;
