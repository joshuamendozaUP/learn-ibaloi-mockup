  .form-check-input:not(:disabled):not(:checked):hover {
  background-color: var(--card);
}

.form-check:not(.form-switch) .form-check-input[type=&quot;checkbox&quot;]:checked {
  border-color: var(--primary);
  background-color: var(--primary);
}

.form-check:not(.form-switch)
  .form-check-input[type=&quot;checkbox&quot;]:checked::before {
  display: block;
  width: 100%;
  height: 100%;
  background: var(--primary-foreground);
  content: &quot;&quot;;
  mask: var(--checkmark-image) center / 12px 12px no-repeat;
}

.form-check-input[type=&quot;radio&quot;] {
  width: 14px;
  height: 14px;
  border-radius: var(--radius-full);
}

.form-check-input[type=&quot;radio&quot;]:checked {
  border: 2px solid var(--primary);
  background:
    radial-gradient(circle, var(--primary-foreground) 0 2.5px, transparent 3px),
    var(--primary);
}

.form-check:not(.form-switch) .form-check-input:focus-visible {
  outline: 2px solid var(--ring);
  outline-offset: 2px;
}

.form-check:not(.form-switch) .form-check-input:disabled {
  cursor: not-allowed;
  pointer-events: none;
}

.form-check:not(.form-switch) .form-check-input:disabled + .form-check-label {
  cursor: not-allowed;
}

.form-switch .form-check-input:disabled,
.form-switch .form-check-input:disabled + .form-check-label {
  cursor: not-allowed;
  opacity: 0.6;
}

.form-check-label {
  color: var(--foreground);
  cursor: var(--cursor-interaction, default);
}

.form-switch .form-check-input {
  position: relative;
  width: 32px;
  height: 20px;
  border: 0;
  border-radius: var(--radius-full);
  background: var(--muted);
  box-shadow: none;
  transition: background-color 200ms cubic-bezier(0, 0, 0.2, 1);
}

.form-switch .form-check-input::before {
  position: absolute;
  top: 50%;
  left: 0;
  width: 16px;
  height: 16px;
  box-sizing: border-box;
  border: 1px solid light-dark(var(--primary-foreground), var(--foreground));
  border-radius: var(--radius-full);
  background: light-dark(var(--primary-foreground), var(--foreground));
  box-shadow: var(--shadow-sm);
  content: &quot;&quot;;
  transform: translate(2px, -50%);
  transition: transform 200ms cubic-bezier(0, 0, 0.2, 1);
}

.form-switch .form-check-input:checked {
  background: var(--primary);
}

.form-switch .form-check-input:checked::before {
  transform: translate(14px, -50%);
}

.form-switch .form-check-input:focus-visible {
  box-shadow: 0 0 0 2px var(--ring);
}

.form-range {
  appearance: none;
  display: block;
  width: 100%;
  height: 28px;
  flex: 1;
  margin: 0;
  padding: 0;
  outline: none;
  border: 0;
  accent-color: var(--primary);
  background: linear-gradient(
      color-mix(in srgb, var(--foreground) 7%, transparent),
      color-mix(in srgb, var(--foreground) 7%, transparent)
    )
    center / 100% 2px no-repeat;
}

.form-range::-webkit-slider-runnable-track {
  height: 28px;
  background: transparent;
}

.form-range::-webkit-slider-thumb {
  appearance: none;
  width: 20px;
  height: 20px;
  margin-top: 4px;
  border: 1px solid var(--border);
  border-radius: var(--radius-full);
  background: light-dark(var(--primary-foreground), var(--foreground));
}

.form-range:focus-visible::-webkit-slider-thumb {
  border-color: var(--ring);
  box-shadow: inset 0 0 0 1px var(--ring);
}

.form-range::-moz-range-track {
  height: 28px;
  background: transparent;
}

.form-range::-moz-range-thumb {
  width: 20px;
  height: 20px;
  border: 1px solid var(--border);
  border-radius: var(--radius-full);
  background: light-dark(var(--primary-foreground), var(--foreground));
}

.form-range:focus-visible::-moz-range-thumb {
  border-color: var(--ring);
  box-shadow: inset 0 0 0 1px var(--ring);
}

.form-range:disabled {
  cursor: not-allowed;
  opacity: 0.4;
}

.btn:not(.btn-primary, .viz-tile):is(
  [aria-pressed=&quot;true&quot;],
  [aria-selected=&quot;true&quot;],
  .is-selected
) {
  border-color: var(--primary);
  color: var(--primary-foreground);
  background: var(--primary);
}

.btn.viz-tile:is([aria-pressed=&quot;true&quot;], [aria-selected=&quot;true&quot;], .is-selected) {
  border-color: var(--primary);
  box-shadow: inset 0 0 0 1px var(--primary);
}

.btn:focus-visible {
  outline: 2px solid var(--ring);
  outline-offset: 2px;
}

@media (pointer: coarse) {
  .btn,
  .form-control,

  }

  .form-control-color[type=&quot;color&quot;] {

    [type=&quot;time&quot;],

  ) {

  }

  .form-check {

    padding-inline: 15px;
  }

  .form-check-input {
    position: relative;
  }

  .form-check-input::after {
    position: absolute;

    left: 50%;
    width: 44px;
    height: 44px;
    content: &quot;&quot;;
    transform: translate(-50%, -50%);
  }

  .form-check-label {
    display: inline-flex;
    min-width: 44px;
    min-height: 44px;
    align-items: center;
  }

  .form-range {
    height: 44px;
    touch-action: pan-y;
  }

  .form-range::-webkit-slider-runnable-track {
    height: 44px;
  }

  .form-range::-moz-range-track {
    height: 44px;
  }

  .form-range::-webkit-slider-thumb {
    margin-top: 12px;
  }
}

svg {

      &lt;div class=&quot;ils-phase&quot;&gt;
        &lt;div class=&quot;ils-phasehead&quot;&gt;&lt;span class=&quot;ils-phase-num&quot;&gt;03&lt;/span&gt;&lt;strong&gt;Choose how to use it&lt;/strong&gt;&lt;span&gt;Branch when context matters&lt;/span&gt;&lt;/div&gt;

            &lt;div class=&quot;ils-screenbody&quot;&gt;&lt;div class=&quot;ils-brandline&quot;&gt;&lt;span class=&quot;ils-mark&quot;&gt;⌕&lt;/span&gt;Ask Ibaloi&lt;/div&gt;&lt;div class=&quot;ils-box&quot;&gt;“How do I greet an elder?”&lt;/div&gt;&lt;div class=&quot;ils-chiprow&quot;&gt;&lt;span class=&quot;ils-chip&quot;&gt;Validated&lt;/span&gt;&lt;span class=&quot;ils-chip&quot;&gt;Variation&lt;/span&gt;&lt;span class=&quot;ils-chip&quot;&gt;Mentor&lt;/span&gt;&lt;/div&gt;&lt;div class=&quot;ils-button light&quot;&gt;Trace source&lt;/div&gt;&lt;/div&gt;
          &lt;/button&gt;
          &lt;span class=&quot;ils-brancharrow&quot; aria-hidden=&quot;true&quot;&gt;↗&lt;/span&gt;
          &lt;button class=&quot;ils-wire&quot; type=&quot;button&quot; data-step=&quot;story&quot; aria-pressed=&quot;false&quot;&gt;
            &lt;div class=&quot;ils-screenbar&quot;&gt;&lt;span&gt;SCREEN 07&lt;/span&gt;&lt;span&gt;□ □ □&lt;/span&gt;&lt;/div&gt;
            &lt;div class=&quot;ils-screenbody&quot;&gt;&lt;div class=&quot;ils-brandline&quot;&gt;&lt;span class=&quot;ils-mark&quot;&gt;◒&lt;/span&gt;Story / place&lt;/div&gt;&lt;div class=&quot;ils-word&quot;&gt;istoria&lt;/div&gt;&lt;div class=&quot;ils-box&quot;&gt;[story image / audio placeholder]&lt;/div&gt;&lt;div class=&quot;ils-chiprow&quot;&gt;&lt;span class=&quot;ils-chip&quot;&gt;iteneng · Listen&lt;/span&gt;&lt;span class=&quot;ils-chip&quot;&gt;Permission&lt;/span&gt;&lt;/div&gt;&lt;div class=&quot;ils-button&quot;&gt;Enter story&lt;/div&gt;&lt;/div&gt;

      &lt;div class=&quot;ils-phase&quot;&gt;
        &lt;div class=&quot;ils-phasehead&quot;&gt;&lt;span class=&quot;ils-phase-num&quot;&gt;04&lt;/span&gt;&lt;strong&gt;Reflect and continue&lt;/strong&gt;&lt;span&gt;Practice, confidence, and connection&lt;/span&gt;&lt;/div&gt;
        &lt;div class=&quot;ils-row&quot;&gt;
          &lt;button class=&quot;ils-wire&quot; type=&quot;button&quot; data-step=&quot;reflect&quot; aria-pressed=&quot;false&quot;&gt;
            &lt;div class=&quot;ils-screenbar&quot;&gt;&lt;span&gt;SCREEN 08&lt;/span&gt;&lt;span&gt;□ □ □&lt;/span&gt;&lt;/div&gt;
            &lt;div class=&quot;ils-screenbody&quot;&gt;&lt;div class=&quot;ils-brandline&quot;&gt;&lt;span class=&quot;ils-mark&quot;&gt;♡&lt;/span&gt;Reflect&lt;/div&gt;&lt;div class=&quot;ils-headline&quot;&gt;What felt easy?&lt;/div&gt;&lt;div class=&quot;ils-line&quot;&gt;&lt;/div&gt;&lt;div class=&quot;ils-line short&quot;&gt;&lt;/div&gt;&lt;div class=&quot;ils-chiprow&quot;&gt;&lt;span class=&quot;ils-chip&quot;&gt;Save phrase&lt;/span&gt;&lt;span class=&quot;ils-chip&quot;&gt;Try again&lt;/span&gt;&lt;span class=&quot;ils-chip&quot;&gt;Ask mentor&lt;/span&gt;&lt;/div&gt;&lt;div class=&quot;ils-button&quot;&gt;Choose next step&lt;/div&gt;&lt;/div&gt;

        &lt;div class=&quot;ils-listitem&quot;&gt;&lt;b&gt;2&lt;/b&gt;&lt;span&gt;&lt;strong&gt;System:&lt;/strong&gt; explains language scope, community authority, and permission boundaries.&lt;/span&gt;&lt;/div&gt;

  &lt;/main&gt;

&lt;script&gt;
(() =&gt; {
  const root = document.getElementById(&#x27;ibaloiLearnerSketch&#x27;);
  if (!root) return;
  const data = {
    welcome: {title:&#x27;Welcome / consent&#x27;, subtitle:&#x27;Trust comes before practice.&#x27;, items:[&#x27;Learner: chooses whether to continue independently or ask for a human guide.&#x27;,&#x27;System: explains language scope, community authority, and permission boundaries.&#x27;,&#x27;Next: choose a learning purpose and context.&#x27;], question:&#x27;What must the learner understand before they see their first word?&#x27;},
    context: {title:&#x27;Purpose and context&#x27;, subtitle:&#x27;The path follows a situation, not an identity score.&#x27;, items:[&#x27;Learner: selects why they want to learn and the setting or locality when appropriate.&#x27;,&#x27;System: uses context to shape examples and practice situations.&#x27;,&#x27;Next: open a small daily route.&#x27;], question:&#x27;Which contexts should be available in the first learner test?&#x27;},
    today: {title:&#x27;Today’s path&#x27;, subtitle:&#x27;One small practice rhythm.&#x27;, items:[&#x27;Learner: chooses words, a situation, or an approved story.&#x27;,&#x27;System: offers one clear next action without XP or public ranking.&#x27;,&#x27;Next: enter Word Garden or another practice route.&#x27;], question:&#x27;What can a learner finish in three minutes and still feel useful?&#x27;},
    garden: {title:&#x27;Word Garden&#x27;, subtitle:&#x27;Vocabulary stays attached to evidence.&#x27;, items:[&#x27;Learner: taps a word, reveals the English gloss, hears it, and saves it.&#x27;,&#x27;System: shows part of speech, source, locality when known, permission, and review status.&#x27;,&#x27;Next: practice the word in a situation.&#x27;], question:&#x27;Which word records are safe enough to show in the first MVP?&#x27;},
    practice: {title:&#x27;Practice loop&#x27;, subtitle:&#x27;Hear → understand → use → reflect.&#x27;, items:[&#x27;Learner: listens, recalls, says the word, and tries again with an explanation.&#x27;,&#x27;System: gives a grounded correction and makes uncertainty visible.&#x27;,&#x27;Next: ask a question, enter a story, or reflect.&#x27;], question:&#x27;Where should the learner hear a human recording instead of an automated voice?&#x27;},
    ask: {title:&#x27;Ask Ibaloi&#x27;, subtitle:&#x27;A question can end in evidence or human help.&#x27;, items:[&#x27;Learner: asks about a phrase, relationship, place, or situation.&#x27;,&#x27;System: shows validated examples, variation, source trace, or a mentor route.&#x27;,&#x27;Next: use the example, compare a variation, or request help.&#x27;], question:&#x27;What wording should appear when the app does not know enough to answer?&#x27;},
    story: {title:&#x27;Story / place&#x27;, subtitle:&#x27;Language is encountered with people and place.&#x27;, items:[&#x27;Learner: listens to an approved story and responds in English or Ibaloi.&#x27;,&#x27;System: shows permission, locality, contributor credit, and transcript controls.&#x27;,&#x27;Next: reflect, save language practice, or ask for context.&#x27;], question:&#x27;Which story permissions must be visible before playback?&#x27;},
    reflect: {title:&#x27;Reflect and continue&#x27;, subtitle:&#x27;Progress includes confidence and connection.&#x27;, items:[&#x27;Learner: records what felt easy, difficult, useful, or worth revisiting.&#x27;,&#x27;System: offers retry, save, mentor support, and a next small step.&#x27;,&#x27;Next: continue the rhythm or return to a word.&#x27;], question:&#x27;Which reflection prompt feels natural rather than like a survey?&#x27;}
  };
  const title = root.querySelector(&#x27;#ilsDetailTitle&#x27;);
  const subtitle = root.querySelector(&#x27;#ilsDetailSubtitle&#x27;);
  const list = root.querySelector(&#x27;#ilsDetailList&#x27;);
  const scribble = root.querySelector(&#x27;.ils-scribble&#x27;);
  function selectStep(name) {
    const item = data[name] || data.welcome;
    root.querySelectorAll(&#x27;[data-step]&#x27;).forEach(button =&gt; {
      const selected = button.dataset.step === name;
      button.classList.toggle(&#x27;is-selected&#x27;, selected);
      button.setAttribute(&#x27;aria-pressed&#x27;, String(selected));
    });
    title.textContent = item.title;
    subtitle.textContent = item.subtitle;
    list.innerHTML = item.items.map((text, index) =&gt; &#x27;&lt;div class=&quot;ils-listitem&quot;&gt;&lt;b&gt;&#x27;+(index + 1)+&#x27;&lt;/b&gt;&lt;span&gt;&#x27;+text+&#x27;&lt;/span&gt;&lt;/div&gt;&#x27;).join(&#x27;&#x27;);
    scribble.innerHTML = &#x27;&lt;strong&gt;Sketch question:&lt;/strong&gt;&lt;br&gt;&#x27;+item.question;
  }
  root.addEventListener(&#x27;click&#x27;, event =&gt; {
    const button = event.target.closest(&#x27;[data-step]&#x27;);
    if (button) selectStep(button.dataset.step);
  });
  selectStep(&#x27;welcome&#x27;);
})();
&lt;/script&gt;

&lt;script src=&quot;https://unpkg.com/@floating-ui/core@1.7.3/dist/floating-ui.core.umd.min.js&quot;&gt;&lt;/script&gt;
&lt;script src=&quot;https://unpkg.com/@floating-ui/dom@1.7.4/dist/floating-ui.dom.umd.min.js&quot;&gt;&lt;/script&gt;
&lt;script&gt;
(() =&gt; {
  if (window.FloatingUIDOM == null) {
    return;
  }
  const { autoUpdate, computePosition, flip, offset, shift, size } =
    window.FloatingUIDOM;
  const tooltipPlacements = new Set([&quot;top&quot;, &quot;right&quot;, &quot;bottom&quot;, &quot;left&quot;]);
  const tooltipId = `codex-visualization-tooltip-${
    window.crypto?.randomUUID?.() ?? Date.now().toString(36)
  }`;
  const tooltipGap = 5;
  const hoverDelay = 700;
  const skipDelay = 300;
  let activeTrigger = null;
  let pendingTrigger = null;
  let tooltip = null;
  let openTimeout = null;
  let autoUpdateCleanup = null;
  let positionRequest = 0;
  let skipDelayUntil = 0;
  let lastPointerWasTouch = false;
  let pinnedByTouch = false;

  const getTrigger = (target) =&gt;
    target?.nodeType === Node.ELEMENT_NODE
      ? target.closest(&quot;[data-tooltip]&quot;)
      : null;
  const containsTarget = (trigger, target) =&gt;
    target?.nodeType != null &amp;&amp; trigger.contains(target);
  const getContent = (trigger) =&gt;
    trigger.getAttribute(&quot;data-tooltip&quot;)?.trim() ?? &quot;&quot;;
  const getPlacement = (trigger) =&gt; {
    const placement = trigger.getAttribute(&quot;data-tooltip-placement&quot;);
    return tooltipPlacements.has(placement) ? placement : &quot;top&quot;;
  };
  const getTooltip = () =&gt; {
    if (tooltip == null) {
      tooltip = document.createElement(&quot;div&quot;);
      tooltip.id = tooltipId;
      tooltip.className = &quot;tooltip&quot;;
      tooltip.setAttribute(&quot;role&quot;, &quot;tooltip&quot;);
    }
    return tooltip;
  };
  const setDescribedBy = (trigger, described) =&gt; {
    const ids = new Set(
      (trigger.getAttribute(&quot;aria-describedby&quot;) ?? &quot;&quot;)
        .split(/\s+/)
        .filter(Boolean),
    );
    if (described) {
      ids.add(tooltipId);
    } else {
      ids.delete(tooltipId);
    }
    if (ids.size === 0) {
      trigger.removeAttribute(&quot;aria-describedby&quot;);
    } else {
      trigger.setAttribute(&quot;aria-describedby&quot;, [...ids].join(&quot; &quot;));
    }
  };
  const clearOpenTimeout = () =&gt; {
    if (openTimeout != null) {
      window.clearTimeout(openTimeout);
      openTimeout = null;
    }
    pendingTrigger = null;
  };
  const closeTooltip = (activateSkipDelay = true) =&gt; {
    clearOpenTimeout();
    pinnedByTouch = false;
    positionRequest += 1;
    autoUpdateCleanup?.();
    autoUpdateCleanup = null;
    if (activeTrigger == null) {
      return;
    }
    setDescribedBy(activeTrigger, false);
    activeTrigger = null;
    tooltip?.remove();
    if (activateSkipDelay) {
      skipDelayUntil = Date.now() + skipDelay;
    }
  };
  const updatePosition = (trigger, floating) =&gt; {
    const request = ++positionRequest;
    void computePosition(trigger, floating, {
      middleware: [
        offset(tooltipGap),
        flip({ padding: tooltipGap }),
        shift({ padding: tooltipGap }),
        size({
          padding: tooltipGap,
          apply({ availableHeight, availableWidth, elements }) {
            elements.floating.style.setProperty(
              &quot;--tooltip-available-width&quot;,
              `${Math.max(0, availableWidth)}px`,
            );
            elements.floating.style.setProperty(
              &quot;--tooltip-available-height&quot;,
              `${Math.max(0, availableHeight)}px`,
            );
          },
        }),
      ],
      placement: getPlacement(trigger),
      strategy: &quot;fixed&quot;,
    })
      .then(({ x, y }) =&gt; {
        if (activeTrigger !== trigger || request !== positionRequest) {
          return;
        }
        const scale = window.devicePixelRatio || 1;
        floating.style.transform = `translate(${Math.round(x * scale) / scale}px, ${Math.round(y * scale) / scale}px)`;
        floating.style.visibility = &quot;visible&quot;;
      })
      .catch(() =&gt; {
        if (activeTrigger === trigger &amp;&amp; request === positionRequest) {
          closeTooltip(false);
        }
      });
  };
  const openTooltip = (trigger) =&gt; {
    const content = getContent(trigger);
    if (!trigger.isConnected || content.length === 0) {
      return;
    }
    clearOpenTimeout();
    if (activeTrigger === trigger) {
      return;
    }
    closeTooltip();
    const floating = getTooltip();
    floating.textContent = content;
    floating.style.visibility = &quot;hidden&quot;;
    floating.style.transform = &quot;translate(0, 0)&quot;;
    document.body.appendChild(floating);
    activeTrigger = trigger;
    setDescribedBy(trigger, true);
    autoUpdateCleanup = autoUpdate(trigger, floating, () =&gt; {
      updatePosition(trigger, floating);
    });
  };
  const requestOpen = (trigger, immediate = false) =&gt; {
    if (
      getContent(trigger).length === 0 ||
      activeTrigger === trigger ||
      pendingTrigger === trigger
    ) {
      return;
    }
    clearOpenTimeout();
    pendingTrigger = trigger;
    const delay =
      immediate || activeTrigger != null || Date.now() &lt; skipDelayUntil
        ? 0
        : hoverDelay;
    if (delay === 0) {
      openTooltip(trigger);
      return;
    }
    openTimeout = window.setTimeout(() =&gt; {
      openTimeout = null;
      pendingTrigger = null;
      openTooltip(trigger);
    }, delay);
  };
  const handlePointerOpen = (event) =&gt; {
    if (event.pointerType === &quot;touch&quot;) {
      return;
    }
    const trigger = getTrigger(event.target);
    if (trigger == null || containsTarget(trigger, event.relatedTarget)) {
      return;
    }
    requestOpen(trigger);
  };
  const handlePointer = (event) =&gt; {
    lastPointerWasTouch =
      event.type === &quot;pointerdown&quot; &amp;&amp; event.pointerType === &quot;touch&quot;;
  };
  const handleTouchClick = (event) =&gt; {
    const isTouch = event.pointerType === &quot;touch&quot; || lastPointerWasTouch;
    lastPointerWasTouch = false;
    if (!isTouch || event.detail === 0) {
      return;
    }
    const trigger = getTrigger(event.target);
    if (
      trigger == null ||
      !trigger.isConnected ||
      getContent(trigger).length === 0 ||
      (pinnedByTouch &amp;&amp; activeTrigger === trigger)
    ) {
      if (pinnedByTouch) {
        closeTooltip();
      }
      return;
    }
    openTooltip(trigger);
    pinnedByTouch = activeTrigger === trigger;
    window.setTimeout(() =&gt; {
      if (activeTrigger === trigger &amp;&amp; !trigger.isConnected) {
        closeTooltip(false);
      }
    }, 0);
  };
  const handleLeave = (event) =&gt; {
    if (pinnedByTouch) {
      return;
    }
    const trigger = getTrigger(event.target);
    if (trigger == null || containsTarget(trigger, event.relatedTarget)) {
      return;
    }
    if (activeTrigger === trigger || pendingTrigger === trigger) {
      closeTooltip();
    }
  };
  const handleFocusIn = (event) =&gt; {
    const trigger = getTrigger(event.target);
    if (trigger?.matches(&quot;:focus-visible&quot;)) {
      requestOpen(trigger, true);
    }
  };
  const handleKeyDown = (event) =&gt; {
    if (event.key === &quot;Escape&quot;) {
      closeTooltip();
    }
  };
  const handleContextMenu = (event) =&gt; {
    lastPointerWasTouch = false;
    const trigger = getTrigger(event.target);
    if (activeTrigger === trigger || pendingTrigger === trigger) {
      closeTooltip();
    }
  };
  const destroy = () =&gt; {
    closeTooltip(false);
    lastPointerWasTouch = false;
    document.removeEventListener(&quot;pointerover&quot;, handlePointerOpen);
    document.removeEventListener(&quot;pointerdown&quot;, handlePointer);
    document.removeEventListener(&quot;pointercancel&quot;, handlePointer);
    document.removeEventListener(&quot;click&quot;, handleTouchClick);
    document.removeEventListener(&quot;pointerout&quot;, handleLeave);
    document.removeEventListener(&quot;focusin&quot;, handleFocusIn);
    document.removeEventListener(&quot;focusout&quot;, handleLeave);
    document.removeEventListener(&quot;keydown&quot;, handleKeyDown);
    document.removeEventListener(&quot;contextmenu&quot;, handleContextMenu);
    tooltip = null;
  };

  document.addEventListener(&quot;pointerover&quot;, handlePointerOpen);
  document.addEventListener(&quot;pointerdown&quot;, handlePointer);
  document.addEventListener(&quot;pointercancel&quot;, handlePointer);
  document.addEventListener(&quot;click&quot;, handleTouchClick);
  document.addEventListener(&quot;pointerout&quot;, handleLeave);
  document.addEventListener(&quot;focusin&quot;, handleFocusIn);
  document.addEventListener(&quot;focusout&quot;, handleLeave);
  document.addEventListener(&quot;keydown&quot;, handleKeyDown);
  document.addEventListener(&quot;contextmenu&quot;, handleContextMenu);
  window.addEventListener(&quot;pagehide&quot;, destroy, { once: true });
})();
&lt;/script&gt;
&lt;script id=&quot;codex-visualization-lucide&quot; async src=&quot;https://unpkg.com/lucide@1.17.0/dist/umd/lucide.js&quot;&gt;&lt;/script&gt;
&lt;script&gt;
(() =&gt; {
  const initialize = () =&gt; {
    globalThis.lucide?.createIcons({ attrs: { width: 16, height: 16 } });
  };
  if (globalThis.lucide != null) {
    initialize();
    return;
  }
  document
    .getElementById(&quot;codex-visualization-lucide&quot;)
    ?.addEventListener(&quot;load&quot;, initialize, { once: true });
})();
&lt;/script&gt;
